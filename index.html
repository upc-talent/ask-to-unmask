<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ask to Unmask · United Pharmacy</title>
<meta name="theme-color" content="#223974">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js" defer></script>
<style>
:root{
  --navy:#223974; --orange:#F8991D; --blue:#188CCD; --teal:#00A99B;
  --ink:#1b2b55; --muted:#5f6f92; --line:rgba(34,57,116,.12);
  --glass:rgba(255,255,255,.58); --glass-strong:rgba(255,255,255,.78); --glass-border:rgba(255,255,255,.75);
  --shadow:0 12px 40px rgba(34,57,116,.12), 0 2px 6px rgba(34,57,116,.06);
  --acc:#188CCD; --r:22px;
  --ease:cubic-bezier(.22,.8,.26,1);
  font-family:'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{color:var(--ink);background:#EDF3FA;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
img{display:block;max-width:100%}
[dir=rtl],.ar{font-family:'IBM Plex Sans Arabic','Plus Jakarta Sans',sans-serif}

/* ---------- ambient background ---------- */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:linear-gradient(160deg,#F4F8FC 0%,#E8F1FA 45%,#EEF7F6 100%)}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.42;animation:drift 26s ease-in-out infinite alternate}
.b1{width:46vmax;height:46vmax;background:var(--blue);top:-18vmax;left:-12vmax}
.b2{width:34vmax;height:34vmax;background:var(--orange);bottom:-16vmax;right:-8vmax;opacity:.28;animation-duration:32s}
.b3{width:30vmax;height:30vmax;background:var(--teal);top:30%;right:12%;opacity:.25;animation-duration:38s}
.b4{width:26vmax;height:26vmax;background:var(--navy);bottom:-6vmax;left:18%;opacity:.16;animation-duration:44s}
.pattern{position:absolute;right:-6vmax;top:8vh;width:52vmax;opacity:.5;animation:float 18s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(6vmax,4vmax) scale(1.12)}}
@keyframes float{to{transform:translateY(-2.5vmax) rotate(4deg)}}

/* ---------- glass primitives ---------- */
.glass{background:var(--glass);backdrop-filter:blur(22px) saturate(170%);-webkit-backdrop-filter:blur(22px) saturate(170%);
  border:1px solid var(--glass-border);border-radius:var(--r);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.85)}
.glass.strong{background:var(--glass-strong)}

/* ---------- layout ---------- */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:12px clamp(14px,3vw,28px);
  background:rgba(255,255,255,.5);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);border-bottom:1px solid rgba(255,255,255,.7)}
.top .logo{height:34px;width:auto}
.top .brand{display:flex;flex-direction:column;line-height:1.1;padding-left:14px;border-left:1px solid var(--line)}
.top .brand b{font-size:15px;letter-spacing:.06em;color:var(--navy);font-weight:800}
.top .brand span{font-size:11px;color:var(--muted);letter-spacing:.04em}
.top .sp{flex:1}
.wrap{max-width:1280px;margin:0 auto;padding:clamp(14px,2.4vw,28px)}
.foot{text-align:center;font-size:11px;color:var(--muted);padding:18px 0 90px;letter-spacing:.05em}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer;border-radius:14px;padding:12px 20px;font-weight:700;font-size:15px;
  background:var(--navy);color:#fff;box-shadow:0 8px 22px rgba(34,57,116,.25);transition:transform .25s var(--ease),box-shadow .25s,opacity .2s,background .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(34,57,116,.3)}
.btn:active{transform:translateY(0) scale(.98)}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn.acc{background:var(--acc);box-shadow:0 8px 22px color-mix(in srgb,var(--acc) 35%,transparent)}
.btn.orange{background:var(--orange);box-shadow:0 8px 22px rgba(248,153,29,.35)}
.btn.ghost{background:rgba(255,255,255,.6);color:var(--navy);box-shadow:none;border:1px solid var(--glass-border)}
.btn.ghost:hover{background:rgba(255,255,255,.9)}
.btn.sm{padding:8px 14px;font-size:13px;border-radius:11px}
.btn.lg{padding:16px 28px;font-size:17px;border-radius:16px}
.btn.block{width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:700;background:rgba(255,255,255,.65);border:1px solid var(--glass-border);color:var(--navy)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 0 rgba(0,169,155,.5);animation:ping 2s infinite}
@keyframes ping{70%{box-shadow:0 0 0 8px rgba(0,169,155,0)}100%{box-shadow:0 0 0 0 rgba(0,169,155,0)}}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.field input{width:100%;padding:14px 16px;border-radius:14px;border:1px solid rgba(34,57,116,.14);background:rgba(255,255,255,.75);outline:none;font-size:16px;transition:border .2s,box-shadow .2s}
.field input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(24,140,205,.15)}
.code-input{text-align:center;letter-spacing:.25em;font-weight:800;text-transform:uppercase}
.muted{color:var(--muted)}
.h1{font-size:clamp(26px,3.6vw,40px);font-weight:800;color:var(--navy);letter-spacing:-.01em}
.h2{font-size:clamp(19px,2.2vw,24px);font-weight:800;color:var(--navy)}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.center{display:grid;place-items:center;min-height:calc(100vh - 140px)}

/* ---------- view transitions ---------- */
.view{animation:viewIn .55s var(--ease) both}
@keyframes viewIn{from{opacity:0;transform:translateY(14px) scale(.99)}to{opacity:1;transform:none}}
.stagger>*{animation:viewIn .5s var(--ease) both}
.stagger>*:nth-child(2){animation-delay:.06s}.stagger>*:nth-child(3){animation-delay:.12s}.stagger>*:nth-child(4){animation-delay:.18s}
.stagger>*:nth-child(5){animation-delay:.24s}.stagger>*:nth-child(6){animation-delay:.3s}

/* ---------- landing ---------- */
.hero{width:min(440px,100%);padding:30px 28px}
.hero .logo{height:46px;margin:0 auto 18px}
.hero .title{text-align:center;margin-bottom:6px}
.hero .sub{text-align:center;color:var(--muted);font-size:14px;margin-bottom:22px}
.seg{display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:14px;background:rgba(34,57,116,.07);margin-bottom:20px;position:relative}
.seg button{border:0;background:none;padding:10px;border-radius:11px;font-weight:700;font-size:14px;cursor:pointer;color:var(--muted);position:relative;z-index:1;transition:color .3s}
.seg button.on{color:var(--navy)}
.seg .pill{position:absolute;top:4px;bottom:4px;width:calc(50% - 4px);left:4px;border-radius:11px;background:#fff;box-shadow:0 4px 12px rgba(34,57,116,.12);transition:transform .4s var(--ease)}
.seg.r .pill{transform:translateX(100%)}

/* ---------- trainer lobby ---------- */
.grid-lobby{display:grid;grid-template-columns:minmax(280px,360px) 1fr;gap:22px;align-items:start}
.newcard{padding:28px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.newcard::after{content:"";position:absolute;width:220px;height:220px;right:-70px;bottom:-90px;border-radius:50%;background:radial-gradient(circle,rgba(248,153,29,.35),transparent 70%)}
.runs{display:grid;gap:12px}
.runrow{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;padding:16px 18px}
.runid{font-weight:800;font-size:18px;color:var(--navy);letter-spacing:.04em}
.pill-status{font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px;letter-spacing:.05em;text-transform:uppercase}
.pill-status.Active{background:rgba(0,169,155,.14);color:#007d72}
.pill-status.Ended{background:rgba(34,57,116,.08);color:var(--muted)}
.mini-progress{height:6px;border-radius:6px;background:rgba(34,57,116,.08);overflow:hidden;margin-top:8px;max-width:260px}
.mini-progress i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--teal));border-radius:6px}

/* ---------- trainer control ---------- */
.ctrlbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.stepper{display:flex;align-items:center;gap:6px;padding:8px 14px;flex-wrap:wrap}
.step{width:10px;height:10px;border-radius:50%;background:color-mix(in srgb,var(--c) 30%,white);transition:all .4s var(--ease)}
.step.r{border-radius:3px;transform:rotate(45deg);width:8px;height:8px}
.step.done{background:var(--c)}
.step.now{width:26px;border-radius:6px;background:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 22%,transparent);transform:none;height:10px}
.stage{display:grid;grid-template-columns:minmax(240px,32%) 1fr;gap:26px;padding:26px;align-items:start}
.round-title{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.round-title::before{content:"";width:6px;height:30px;border-radius:4px;background:linear-gradient(var(--acc),var(--orange))}
.round-title b{font-size:clamp(18px,2vw,24px);font-weight:800;color:var(--navy);letter-spacing:.02em}

.cust{position:relative}
.bubble{position:relative;padding:18px 20px 18px 22px;border-radius:20px;background:color-mix(in srgb,var(--acc) 12%,rgba(255,255,255,.75));border:1px solid rgba(255,255,255,.8);font-size:clamp(15px,1.4vw,18px);line-height:1.75;font-weight:600;margin-bottom:16px}
.bubble::after{content:"";position:absolute;left:44px;bottom:-12px;width:24px;height:24px;background:inherit;border-right:1px solid rgba(255,255,255,.8);border-bottom:1px solid rgba(255,255,255,.8);transform:rotate(45deg);border-radius:0 0 6px 0;
  background:color-mix(in srgb,var(--acc) 12%,rgba(255,255,255,.75))}
.bubble .q{position:absolute;top:-6px;left:12px;font-size:40px;line-height:1;color:var(--orange);font-family:Georgia,serif}
.u-figure{position:relative;width:min(100%,300px);aspect-ratio:720/820;margin:4px auto 0}
.u-figure img{position:absolute;left:0;width:100%}
.u-figure .u{bottom:0;height:85.9%;object-fit:fill;filter:hue-rotate(var(--uhue,0deg))}
.u-figure .p{top:0;height:100%;object-fit:contain;animation:rise .9s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}

.ask{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.avatar{width:64px;height:64px;border-radius:50%;overflow:hidden;flex:none;background:#fff;border:3px solid #fff;box-shadow:0 6px 18px rgba(34,57,116,.15)}
.avatar img{width:100%;height:100%;object-fit:cover;object-position:top}
.askbubble{flex:1;padding:14px 20px;border-radius:16px;background:var(--acc);color:#fff;font-weight:700;font-size:clamp(15px,1.5vw,19px);box-shadow:0 10px 24px color-mix(in srgb,var(--acc) 30%,transparent)}
.askbubble small{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.85;margin-bottom:2px}

.opts{display:grid;gap:12px}
.opt{position:relative;display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:16px;overflow:hidden;
  background:rgba(255,255,255,.62);border:1.5px solid rgba(255,255,255,.85);transition:all .45s var(--ease);text-align:start;width:100%}
.opt .fill{position:absolute;inset:0;width:0;background:linear-gradient(90deg,color-mix(in srgb,var(--acc) 22%,transparent),color-mix(in srgb,var(--acc) 12%,transparent));transition:width .9s var(--ease);z-index:0}
.opt[dir=rtl] .fill{left:auto;right:0}
.opt>*:not(.fill):not(.mine-tag){position:relative;z-index:1}
.opt .let{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:800;color:#fff;background:var(--acc);font-family:'Plus Jakarta Sans',sans-serif}
.opt .txt{flex:1;font-size:clamp(14px,1.35vw,17px);line-height:1.65;font-weight:600}
.opt .pct{flex:none;font-weight:800;font-size:15px;min-width:64px;text-align:end;color:var(--navy);font-family:'Plus Jakarta Sans',sans-serif;opacity:0;transition:opacity .4s}
.opt .pct small{display:block;font-size:11px;font-weight:600;color:var(--muted)}
.opt.showpct .pct{opacity:1}
.opt.correct{border-color:var(--acc);background:rgba(255,255,255,.9);box-shadow:0 10px 28px color-mix(in srgb,var(--acc) 25%,transparent)}
.opt.correct .let{background:var(--teal)}
.opt.dim{opacity:.55;filter:saturate(.6)}
.opt .tick{flex:none;width:26px;height:26px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:900;
  box-shadow:0 4px 10px rgba(0,169,155,.4);animation:pop .5s var(--ease) both}
.opt:not(.showpct) .pct{display:none}
@keyframes pop{from{transform:scale(0)}60%{transform:scale(1.2)}}

.counter{display:flex;align-items:center;gap:16px;margin-top:18px;padding:14px 18px}
.ring{--p:0;width:58px;height:58px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--acc) calc(var(--p)*1%),rgba(34,57,116,.08) 0);transition:--p .8s}
.ring::before{content:"";position:absolute;width:44px;height:44px;border-radius:50%;background:#fff}
.ring{position:relative}.ring b{position:relative;font-size:13px;font-weight:800;color:var(--navy)}
.counter .big{font-size:28px;font-weight:800;color:var(--navy);line-height:1}
.counter .lbl{font-size:12px;color:var(--muted);font-weight:600}

/* lobby (share) */
.lobbystage{display:grid;grid-template-columns:minmax(280px,380px) 1fr;gap:22px}
.qrbox{padding:26px;text-align:center}
.qr{width:min(100%,260px);aspect-ratio:1;margin:12px auto;background:#fff;border-radius:18px;padding:14px;box-shadow:inset 0 0 0 1px var(--line)}
.qr img{width:100%;height:100%;image-rendering:pixelated}
.joincode{font-size:44px;font-weight:800;letter-spacing:.14em;color:var(--navy);margin:4px 0}
.link{font-size:12px;word-break:break-all;color:var(--muted);background:rgba(34,57,116,.05);padding:8px 10px;border-radius:10px;margin:10px 0}
.people{padding:26px;min-height:360px;display:flex;flex-direction:column}
.cloud{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;align-content:flex-start;flex:1}
.pname{padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.8);border:1px solid var(--glass-border);font-weight:600;font-size:14px;animation:pop .5s var(--ease) both;box-shadow:0 4px 12px rgba(34,57,116,.06)}
.bigcount{font-size:64px;font-weight:800;color:var(--navy);line-height:1}

/* reflection */
.refl{padding:26px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-top:8px}
.rcard{padding:18px;border-radius:20px;background:color-mix(in srgb,var(--acc) 9%,rgba(255,255,255,.72));border:1px solid rgba(255,255,255,.85);display:flex;flex-direction:column;gap:14px;animation:viewIn .6s var(--ease) both}
.rcard .quote{font-size:15px;line-height:1.75;font-weight:600;min-height:52px}
.rcard img{width:100%;max-width:170px;aspect-ratio:1.05;object-fit:cover;border-radius:16px;margin:0 auto;box-shadow:0 8px 20px rgba(34,57,116,.12)}
.rcard .lab{font-weight:800;color:var(--navy);padding-left:10px;border-left:4px solid var(--acc);font-size:15px;line-height:1.35}
.rcard.flip .lab{filter:blur(7px);opacity:.5;transition:filter .5s,opacity .5s;cursor:pointer}
.rcard.flip.open .lab{filter:none;opacity:1}

/* ---------- learner ---------- */
.lwrap{max-width:560px;margin:0 auto;padding:16px}
.lcard{padding:22px}
.lhead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.lhead .avatar{width:56px;height:56px}
.lopts .opt{cursor:pointer;min-height:64px}
.lopts .opt:hover{transform:translateY(-2px);background:rgba(255,255,255,.85)}
.lopts .opt.mine{border-color:var(--orange);background:rgba(255,255,255,.92);padding-bottom:24px}
.lopts .opt.mine .let{background:var(--orange)}
.lopts.locked .opt{cursor:default}.lopts.locked .opt:hover{transform:none}
.mine-tag{position:absolute;z-index:2;bottom:0;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:var(--orange);color:#fff;padding:2px 8px;border-radius:8px 8px 0 0}
.opt[dir=rtl] .mine-tag{left:14px}.opt[dir=ltr] .mine-tag{right:14px}
.wait{display:flex;align-items:center;gap:12px;padding:14px 16px;margin-top:14px;border-radius:16px;background:rgba(255,255,255,.7);font-weight:600}
.dots i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--acc);margin:0 2px;animation:bounce 1.2s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bounce{40%{transform:translateY(-6px);opacity:.6}}
.ready{text-align:center;padding:36px 26px}
.check{width:92px;height:92px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(140deg,var(--teal),var(--blue));box-shadow:0 14px 34px rgba(0,169,155,.35);animation:pop .7s var(--ease) both}
.check svg{width:46px;height:46px;stroke:#fff;stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:draw .6s .35s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.breath{animation:breath 3.2s ease-in-out infinite}
@keyframes breath{50%{transform:scale(1.04)}}
.verdict{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:18px;margin-bottom:14px;font-weight:700;animation:viewIn .5s var(--ease) both}
.verdict.ok{background:linear-gradient(120deg,rgba(0,169,155,.16),rgba(24,140,205,.12));color:#006f66}
.verdict.no{background:rgba(248,153,29,.14);color:#9a5a05}
.verdict .em{font-size:30px}
.verdict .pts{margin-left:auto;font-size:22px;font-weight:800}
.scorebar{display:flex;gap:10px;margin-bottom:14px}
.scorebar .glass{flex:1;padding:12px 14px;text-align:center;border-radius:16px}
.scorebar b{display:block;font-size:24px;color:var(--navy);font-weight:800}
.scorebar span{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.08em;text-transform:uppercase}

/* ---------- leaderboard ---------- */
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:40;width:62px;height:62px;border-radius:50%;border:0;cursor:pointer;
  background:linear-gradient(140deg,var(--orange),#f6b04d);color:#fff;box-shadow:0 12px 30px rgba(248,153,29,.45);display:grid;place-items:center;transition:transform .3s var(--ease)}
.fab:hover{transform:translateY(-3px) scale(1.04)}
.fab svg{width:28px;height:28px}
.fab .badge{position:absolute;top:-4px;right:-4px;min-width:26px;height:26px;padding:0 6px;border-radius:13px;background:var(--navy);font-size:12px;font-weight:800;display:grid;place-items:center;border:2px solid #fff}
.drawer-bg{position:fixed;inset:0;z-index:50;background:rgba(27,43,85,.25);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .35s}
.drawer-bg.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);z-index:51;transform:translateX(105%);transition:transform .5s var(--ease);border-radius:26px 0 0 26px;display:flex;flex-direction:column;padding:22px 20px 14px}
.drawer.on{transform:none}
.drawer .list{overflow:auto;flex:1;margin-top:12px;padding-right:4px}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:10px;margin:14px 0 6px}
.pod{text-align:center}
.pod .av{width:54px;height:54px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;font-weight:800;font-size:18px;color:#fff;box-shadow:0 8px 18px rgba(34,57,116,.18)}
.pod .nm{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.pod .bar{margin-top:8px;border-radius:16px 16px 8px 8px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:10px;color:#fff;font-weight:800;animation:grow .9s var(--ease) both;transform-origin:bottom}
.pod .bar span{font-size:22px}.pod .bar small{font-size:11px;opacity:.9}
.pod.p1 .bar{height:120px;background:linear-gradient(var(--orange),#f7b354)}.pod.p1 .av{background:var(--orange);width:64px;height:64px}
.pod.p2 .bar{height:88px;background:linear-gradient(var(--blue),#4fb0e3);animation-delay:.12s}.pod.p2 .av{background:var(--blue)}
.pod.p3 .bar{height:66px;background:linear-gradient(var(--teal),#3cc3b7);animation-delay:.24s}.pod.p3 .av{background:var(--teal)}
@keyframes grow{from{transform:scaleY(0)}}
.lbrow{display:grid;grid-template-columns:38px 1fr auto;align-items:center;gap:10px;padding:11px 12px;border-radius:14px;margin-bottom:6px;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.7);
  transition:transform .5s var(--ease),background .3s;animation:viewIn .45s var(--ease) both}
.lbrow .rk{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:13px;background:rgba(34,57,116,.07);color:var(--navy)}
.lbrow .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbrow .pt{font-weight:800;color:var(--navy);font-size:16px}
.lbrow.me{background:linear-gradient(120deg,rgba(248,153,29,.2),rgba(255,255,255,.8));border-color:rgba(248,153,29,.5)}
.lbrow.me .rk{background:var(--orange);color:#fff}
.empty{padding:30px;text-align:center;color:var(--muted)}

/* projector board */
.board{display:grid;grid-template-columns:1.1fr 1fr;gap:24px;align-items:start}
.board .podium{margin-top:30px}
.board .pod .bar{height:auto}
.board .pod.p1 .bar{height:210px}.board .pod.p2 .bar{height:160px}.board .pod.p3 .bar{height:120px}
.board .pod .av{width:80px;height:80px;font-size:26px}.board .pod.p1 .av{width:96px;height:96px}
.board .pod .nm{font-size:18px}
.board .lbrow{padding:13px 16px}.board .lbrow .nm{font-size:17px}.board .lbrow .pt{font-size:19px}
.cols2{columns:2;column-gap:12px}.cols2 .lbrow{break-inside:avoid}

/* results */
.qstat{padding:18px 20px;margin-bottom:12px}
.accbar{height:10px;border-radius:8px;background:rgba(34,57,116,.08);overflow:hidden;margin:10px 0 8px}
.accbar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--blue));border-radius:8px;transition:width 1s var(--ease)}
.dist{display:flex;gap:8px;flex-wrap:wrap}
.dist span{font-size:12px;font-weight:700;padding:4px 10px;border-radius:9px;background:rgba(34,57,116,.06)}
.dist span.c{background:rgba(0,169,155,.16);color:#007d72}

/* modal + toast */
.modal-bg{position:fixed;inset:0;z-index:60;background:rgba(27,43,85,.3);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;animation:fade .3s both}
@keyframes fade{from{opacity:0}}
.modal{width:min(440px,100%);padding:26px;animation:viewIn .45s var(--ease) both}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,30px);z-index:70;padding:12px 18px;border-radius:14px;background:rgba(27,43,85,.92);color:#fff;font-weight:600;font-size:14px;opacity:0;transition:all .4s var(--ease);pointer-events:none;max-width:90vw}
.toast.on{opacity:1;transform:translate(-50%,0)}
.spinner{width:22px;height:22px;border-radius:50%;border:3px solid rgba(34,57,116,.15);border-top-color:var(--blue);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.net{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:30;font-size:12px;font-weight:700;padding:6px 12px;border-radius:999px;background:rgba(248,153,29,.95);color:#fff;display:none}
.net.on{display:block;animation:fade .3s}
.spark{position:fixed;pointer-events:none;z-index:80;width:8px;height:8px;border-radius:2px;animation:spark 1.4s var(--ease) forwards}
@keyframes spark{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
.kbd{font-size:11px;color:var(--muted);margin-left:6px}
.kbd b{border:1px solid var(--line);border-radius:6px;padding:1px 6px;background:rgba(255,255,255,.7)}

@media (max-width:900px){
  .stage,.lobbystage,.grid-lobby,.board{grid-template-columns:1fr}
  .u-figure{width:200px}
  .cols2{columns:1}
}
@media (max-width:560px){
  .opt{gap:10px;padding:12px}.opt .let{width:32px;height:32px;border-radius:10px}.opt .pct{min-width:48px;font-size:13px}
  .top .brand{display:none}
  .top .logo{height:28px}
  .runrow{grid-template-columns:1fr;gap:10px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

/* ============================ utilities ============================ */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const isAr = s => /[\u0600-\u06FF]/.test(s || '');
const dir = s => isAr(s) ? 'rtl' : 'ltr';
const img = n => !n ? '' : /^(https?:|data:)/i.test(n) ? n : (IMAGES[n] || CONFIG.IMG_BASE + n);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const params = new URLSearchParams(location.search);
const store = {
  get: k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del: k => { try { localStorage.removeItem(k); } catch (e) {} }
};
const ICON = {
  trophy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4Z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>',
  check: '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'
};

function toast(msg, ms = 2600) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), ms);
}
function netState(bad) { $('#net').classList.toggle('on', !!bad); }

class ApiError extends Error {}
async function api(action, data = {}, post = false, tries = 3) {
  for (let i = 0; i < tries; i++) {
    const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 20000);
    try {
      let res;
      if (post) res = await fetch(CONFIG.API_URL, { method: 'POST', body: JSON.stringify(Object.assign({ action }, data)), signal: ctl.signal });
      else res = await fetch(CONFIG.API_URL + '?' + new URLSearchParams(Object.assign({ action }, data, { _: Date.now() })), { signal: ctl.signal });
      const j = await res.json();
      netState(false);
      if (!j.ok) {
        if (j.error === 'BUSY' && i < tries - 1) { await sleep(600 + Math.random() * 1400); continue; }
        throw new ApiError(j.error);
      }
      return j;
    } catch (e) {
      if (e instanceof ApiError) throw e;
      netState(true);
      if (i === tries - 1) throw e;
      await sleep(800 * (i + 1) + Math.random() * 600);
    } finally { clearTimeout(to); }
  }
}

/* adaptive poller: jitter + backoff + slows down in background tabs */
const Poller = {
  t: null, fn: null, int: null, fails: 0, id: 0,
  start(fn, interval) { this.stop(); this.fn = fn; this.int = interval; this.fails = 0; const id = ++this.id; this._loop(id); },
  async _loop(id) {
    if (id !== this.id) return;
    try { await this.fn(); this.fails = 0; } catch (e) { this.fails++; handleErr(e, true); }
    if (id !== this.id) return;
    let ms = document.hidden ? CONFIG.POLL.hidden : this.int();
    ms = Math.min(30000, ms * Math.pow(1.6, this.fails)) * (0.85 + Math.random() * 0.3);
    this.t = setTimeout(() => this._loop(id), ms);
  },
  now() { if (this.fn) { clearTimeout(this.t); const id = ++this.id; this._loop(id); } },
  stop() { clearTimeout(this.t); this.id++; }
};
document.addEventListener('visibilitychange', () => { if (!document.hidden) Poller.now(); });

function handleErr(e, quiet) {
  const m = (e && e.message) || String(e);
  if (m === 'AUTH') { store.del('atu_trainer'); toast('Session expired — please log in again'); return goLanding('trainer'); }
  if (!quiet) toast(m === 'BUSY' ? 'Server is busy, please try again' : (/abort|fetch|network/i.test(m) ? 'Connection problem — retrying' : m));
}

function setTop(html) { $('#topRight').innerHTML = html || ''; }
function setApp(html, cls) { const a = $('#app'); a.innerHTML = '<div class="view ' + (cls || '') + '">' + html + '</div>'; window.scrollTo({ top: 0, behavior: 'smooth' }); }
function setAccent(c) { document.documentElement.style.setProperty('--acc', c || '#188CCD'); }

function countUp(el, to, ms = 900) {
  const from = Number(el.dataset.v || 0); el.dataset.v = to;
  if (from === to) { el.textContent = to; return; }
  const t0 = performance.now();
  const step = t => { const k = Math.min(1, (t - t0) / ms); el.textContent = Math.round(from + (to - from) * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

function sparkle(x, y, n = 26) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cols = ['#F8991D', '#188CCD', '#00A99B', '#223974'];
  for (let i = 0; i < n; i++) {
    const s = document.createElement('i'); s.className = 'spark';
    const a = Math.random() * Math.PI * 2, d = 60 + Math.random() * 120;
    s.style.cssText = `left:${x}px;top:${y}px;background:${cols[i % 4]};--x:${Math.cos(a) * d}px;--y:${Math.sin(a) * d + 40}px;--r:${Math.random() * 540}deg`;
    document.body.appendChild(s); setTimeout(() => s.remove(), 1500);
  }
}

function qrImg(text) {
  try {
    if (!window.qrcode) return '';
    const q = qrcode(0, 'M'); q.addData(text); q.make();
    return '<img alt="QR code" src="' + q.createDataURL(8, 0) + '">';
  } catch (e) { return ''; }
}

const joinUrl = runId => location.origin + location.pathname + '?run=' + encodeURIComponent(runId);
const boardUrl = runId => joinUrl(runId) + '&view=board';
async function copy(text) { try { await navigator.clipboard.writeText(text); toast('Link copied'); } catch (e) { toast(text, 5000); } }

function modal(html) {
  const bg = document.createElement('div'); bg.className = 'modal-bg';
  bg.innerHTML = '<div class="modal glass strong">' + html + '</div>';
  bg.addEventListener('click', e => { if (e.target === bg || e.target.closest('[data-close]')) bg.remove(); });
  document.body.appendChild(bg); return bg;
}
function confirmBox(title, body, okLabel) {
  return new Promise(res => {
    const m = modal(`<div class="h2" style="margin-bottom:8px">${esc(title)}</div><p class="muted" style="margin-bottom:20px">${esc(body)}</p>
      <div class="row" style="justify-content:flex-end"><button class="btn ghost" data-close>Cancel</button><button class="btn orange" id="okBtn">${esc(okLabel)}</button></div>`);
    $('#okBtn', m).onclick = () => { m.remove(); res(true); };
    m.addEventListener('click', e => { if (e.target === m || e.target.closest('[data-close]')) res(false); });
  });
}

/* ============================ leaderboard ============================ */
const LB = { runId: null, me: null, rows: [], lbv: -1, open: false, timer: null };
function initials(n) { return String(n || '?').trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase(); }

function mountFab(runId, meKey) {
  LB.runId = runId; LB.me = meKey || null;
  $('#fabSlot').innerHTML = `<button class="fab" id="fab" aria-label="Open leaderboard">${ICON.trophy}<span class="badge" id="fabBadge" style="display:none"></span></button>`;
  $('#fab').onclick = openLB;
  $('#drawerBg').onclick = closeLB;
}
function unmountFab() { $('#fabSlot').innerHTML = ''; closeLB(); }

async function loadLB(force) {
  if (!LB.runId) return;
  const r = await api('board', { runId: LB.runId, lbv: force ? '' : LB.lbv });
  if (r.same) return false;
  LB.rows = r.rows || []; LB.lbv = r.lbv;
  const me = LB.rows.find(x => x.k === LB.me);
  const b = $('#fabBadge');
  if (b) { if (me) { b.style.display = 'grid'; b.textContent = '#' + me.r; } else b.style.display = 'none'; }
  if (LB.open) renderDrawer();
  return true;
}

function podiumHTML(rows) {
  const t = rows.slice(0, 3);
  if (!t.length) return '';
  const cell = (r, cls) => r ? `<div class="pod ${cls}"><div class="av">${esc(initials(r.n))}</div><div class="nm">${esc(r.n)}</div>
    <div class="bar"><span>${r.p}</span><small>pts</small></div></div>` : '<div></div>';
  return `<div class="podium">${cell(t[1], 'p2')}${cell(t[0], 'p1')}${cell(t[2], 'p3')}</div>`;
}
function rowsHTML(rows, start = 0) {
  return rows.map((r, i) => `<div class="lbrow ${r.k === LB.me ? 'me' : ''}" style="animation-delay:${Math.min(i, 12) * 30}ms">
    <div class="rk">${r.r}</div><div class="nm" dir="auto">${esc(r.n)}${r.k === LB.me ? ' <span class="muted" style="font-weight:600">(you)</span>' : ''}</div><div class="pt">${r.p}</div></div>`).join('');
}
function renderDrawer() {
  const rows = LB.rows;
  $('#drawer').innerHTML = `<div class="row" style="justify-content:space-between"><div><div class="eyebrow" style="color:var(--orange)">Live</div><div class="h2">Leaderboard</div></div>
    <button class="btn ghost sm" id="lbClose">Close</button></div>
    ${rows.length ? podiumHTML(rows) : ''}
    <div class="list">${rows.length ? rowsHTML(rows) : '<div class="empty">Scores appear after the first answer is revealed.</div>'}</div>
    <div class="muted" style="font-size:11px;text-align:center;margin-top:8px">Session ${esc(LB.runId)} · 1 point per correct answer</div>`;
  $('#lbClose').onclick = closeLB;
  const mine = $('#drawer .lbrow.me'); if (mine) mine.scrollIntoView({ block: 'center', behavior: 'smooth' });
}
async function openLB() {
  LB.open = true; renderDrawer();
  $('#drawer').classList.add('on'); $('#drawerBg').classList.add('on');
  try { await loadLB(true); } catch (e) { handleErr(e); }
  clearInterval(LB.timer); LB.timer = setInterval(() => loadLB().catch(() => {}), CONFIG.POLL.board);
}
function closeLB() { LB.open = false; clearInterval(LB.timer); $('#drawer').classList.remove('on'); $('#drawerBg').classList.remove('on'); }

      <button data-t="join" class="${t === 'join' ? 'on' : ''}">Join session</button><button data-t="trainer" class="${t === 'trainer' ? 'on' : ''}">Trainer</button></div>

  const pane = $('#pane');
  const show = which => {
    $('#seg').classList.toggle('r', which === 'trainer');
    document.querySelectorAll('#seg button').forEach(b => b.classList.toggle('on', b.dataset.t === which));
    if (which === 'join') {
      pane.innerHTML = `<form id="f" class="view"><div class="field"><label>Session code</label><input class="code-input" id="code" maxlength="10" placeholder="T1-001" autocomplete="off" required></div>
        <button class="btn block lg">Join</button></form>`;
      $('#f').onsubmit = e => { e.preventDefault(); const c = $('#code').value.trim().toUpperCase(); if (c) location.href = joinUrl(c); };
    } else {
      pane.innerHTML = `<form id="f" class="view"><div class="field"><label>Username</label><input id="u" autocomplete="username" required></div>
        <div class="field"><label>Password</label><input id="p" type="password" autocomplete="current-password" required></div>
        <button class="btn block lg" id="go">Log in</button></form>`;
      $('#f').onsubmit = async e => {
        e.preventDefault(); const b = $('#go'); b.disabled = true; b.innerHTML = '<span class="spinner"></span>';
        try {
          const r = await api('login', { username: $('#u').value, password: $('#p').value }, true, 1);
          store.set('atu_trainer', { token: r.token, name: r.name, username: r.username, at: Date.now() });
          goTrainerHome();
        } catch (err) { handleErr(err); b.disabled = false; b.textContent = 'Log in'; }
      };
    }
  };
  document.querySelectorAll('#seg button').forEach(b => b.onclick = () => show(b.dataset.t));
  show(t);
}

/* ============================ trainer ============================ */
const T = { auth: null, runId: null, data: null, key: '', busy: false };

function trainerTop(extra) {
  setTop(`${extra || ''}<span class="chip">${esc(T.auth.name)}</span><button class="btn ghost sm" id="logout">Log out</button>`);
  $('#logout').onclick = () => { store.del('atu_trainer'); store.del('atu_trun'); goLanding('trainer'); };
}

async function goTrainerHome() {
  Poller.stop(); unmountFab(); setAccent('#188CCD');
  T.auth = store.get('atu_trainer'); T.runId = null; store.del('atu_trun');
  if (!T.auth) return goLanding('trainer');
  trainerTop();
  setApp(`<div class="row" style="justify-content:space-between;margin-bottom:20px"><div><div class="eyebrow">Trainer space</div><div class="h1">Welcome, ${esc(T.auth.name)}</div></div></div>
    <div class="grid-lobby stagger">
      <div class="glass strong newcard"><div class="eyebrow" style="color:var(--orange)">New run</div><div class="h2">Start a new activity</div>
        <p class="muted">Creates a new session with its own tab in the sheet. Share the link or QR with participants.</p>
        <button class="btn orange lg" id="newRun">Start activity</button></div>
      <div><div class="h2" style="margin-bottom:12px">Previous activities</div><div class="runs" id="runs"><div class="glass empty"><span class="spinner" style="margin:auto"></span></div></div></div>
    </div>`);
  $('#newRun').onclick = async e => {
    const b = e.currentTarget; b.disabled = true; b.innerHTML = '<span class="spinner"></span> Creating…';
    try { const r = await api('createRun', { token: T.auth.token }, true); openRun(r.runId); }
    catch (err) { handleErr(err); b.disabled = false; b.textContent = 'Start activity'; }
  };
  try {
    const r = await api('runs', { token: T.auth.token });
    const box = $('#runs'); if (!box) return;
    if (!r.runs.length) { box.innerHTML = '<div class="glass empty">No activities yet. Your runs will appear here.</div>'; return; }
    box.innerHTML = r.runs.map(x => {
      const pct = Math.max(0, Math.min(100, ((x.idx + 1) / (r.total || 1)) * 100));
      const d = x.created ? new Date(x.created) : null;
      return `<div class="glass runrow"><div><div class="runid">${esc(x.runId)}</div><span class="pill-status ${esc(x.status)}">${esc(x.status)}</span></div>
        <div><div class="muted" style="font-size:13px">${d ? d.toLocaleString([], { dateStyle: 'medium', timeStyle: 'short', timeZone: 'Asia/Riyadh' }) + ' KSA' : ''} · ${x.participants} participants · ${x.phase === 'ended' ? 'Completed' : x.phase === 'lobby' ? 'Not started' : 'Step ' + (x.idx + 1) + ' of ' + r.total}</div>
        <div class="mini-progress"><i style="width:${x.phase === 'ended' ? 100 : pct}%"></i></div></div>
        <div class="row"><button class="btn ghost sm" data-res="${esc(x.runId)}">Results</button><button class="btn sm" data-open="${esc(x.runId)}" data-status="${esc(x.status)}">${x.status === 'Ended' ? 'Reopen' : 'Resume'}</button></div></div>`;
    }).join('');
    box.querySelectorAll('[data-open]').forEach(b => b.onclick = async () => {
      if (b.dataset.status === 'Ended') {
        if (!await confirmBox('Reopen ' + b.dataset.open + '?', 'The session will continue from where it stopped. Participants can rejoin with the same link.', 'Reopen')) return;
        try { await api('advance', { token: T.auth.token, runId: b.dataset.open, op: 'reopen' }, true); } catch (e) { return handleErr(e); }
      }
      openRun(b.dataset.open);
    });
    box.querySelectorAll('[data-res]').forEach(b => b.onclick = () => showResults(b.dataset.res));
  } catch (e) { handleErr(e); }
}

function openRun(runId) {
  T.runId = runId; T.key = ''; T.data = null; store.set('atu_trun', runId);
  mountFab(runId, null);
  trainerTop(`<span class="chip"><span class="dot"></span>${esc(runId)}</span>`);
  setApp('<div class="center"><span class="spinner"></span></div>');
  Poller.start(trainerTick, () => (T.data && T.data.state.phase === 'open') ? CONFIG.POLL.trainerLive : CONFIG.POLL.trainerIdle);
}

async function trainerTick() {
  const d = await api('tstate', { token: T.auth.token, runId: T.runId });
  T.data = d;
  const s = d.state;
  const key = s.v + '|' + s.phase + '|' + s.idx;
  if (key !== T.key) { T.key = key; renderTrainer(); }
  else patchTrainer();
  if (s.lbv !== LB.lbv) loadLB().catch(() => {});
}

function stepperHTML(d) {
  return `<div class="glass stepper" title="Activity progress">${d.outline.map((o, i) => {
    const cls = i < d.state.idx ? 'done' : i === d.state.idx ? 'now' : '';
    return `<span class="step ${o.type === 'Reflection' ? 'r' : ''} ${cls}" style="--c:${esc(o.accent)}" title="${esc(o.id)}"></span>`;
  }).join('')}</div>`;
}

function ctrlBar(d, main) {
  return `<div class="ctrlbar">${stepperHTML(d)}<div class="sp" style="flex:1"></div>
    <span class="chip">👥 <span id="pc">${d.participants.length}</span></span>
    <button class="btn ghost sm" id="share">Share</button>
    <a class="btn ghost sm" href="${esc(boardUrl(T.runId))}" target="_blank" rel="noopener">Projector board</a>
    <button class="btn ghost sm" id="home">All runs</button>
    ${d.state.phase !== 'ended' ? '<button class="btn ghost sm" id="end">End</button>' : ''}
    ${main || ''}</div>`;
}

function bindCtrl() {
  const s = $('#share'); if (s) s.onclick = shareModal;
  const h = $('#home'); if (h) h.onclick = goTrainerHome;
  const e = $('#end'); if (e) e.onclick = async () => { if (await confirmBox('End this session?', 'Participants will see the final leaderboard. You can reopen it later from your runs.', 'End session')) advance('end'); };
  const n = $('#mainBtn'); if (n) n.onclick = () => advance(n.dataset.op);
}

function shareModal() {
  const url = joinUrl(T.runId);
  const m = modal(`<div class="eyebrow">Invite participants</div><div class="h2" style="margin:4px 0 6px">Scan or open the link</div>
    <div class="qr">${qrImg(url)}</div><div class="joincode" style="text-align:center;font-size:34px">${esc(T.runId)}</div>
    <div class="link">${esc(url)}</div><div class="row" style="justify-content:flex-end"><button class="btn ghost" data-close>Close</button><button class="btn" id="cp">Copy link</button></div>`);
  $('#cp', m).onclick = () => copy(url);
}

async function advance(op) {
  if (T.busy) return; T.busy = true;
  const b = $('#mainBtn'); if (b) { b.disabled = true; b.dataset.label = b.innerHTML; b.innerHTML = '<span class="spinner" style="border-top-color:#fff"></span>'; }
  try { await api('advance', { token: T.auth.token, runId: T.runId, op, v: T.data ? T.data.state.v : '' }, true); T.key = ''; await trainerTick(); }
  catch (e) { handleErr(e); if (b) { b.disabled = false; b.innerHTML = b.dataset.label; } }
  finally { T.busy = false; }
}
document.addEventListener('keydown', e => {
  if (!T.runId || !T.data || document.querySelector('.modal-bg')) return;
  if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter') { const b = $('#mainBtn'); if (b && !b.disabled) { e.preventDefault(); b.click(); } }
});

function stageHTML(it) {
  const stmt = it.statement ? `<div class="bubble" dir="${dir(it.statement)}"><span class="q">“</span>${esc(it.statement)}</div>` : '';
  const fig = it.customerImg ? `<div class="u-figure"><img class="u" src="${img('brand-u.webp')}" alt=""><img class="p" src="${img(it.customerImg)}" alt="Customer"></div>` : '';
  return `<div class="glass strong stage">
    <div class="cust">${stmt}${fig}</div>
    <div>
      <div class="round-title"><b>${esc(it.title)}</b></div>
      <div class="ask">${it.pharmacistImg ? `<div class="avatar"><img src="${img(it.pharmacistImg)}" alt="Pharmacist"></div>` : ''}
        <div class="askbubble" dir="${dir(it.stem)}"><small>${it.type === 'FollowUp' ? 'Follow-up question' : 'Your move'}</small>${esc(it.stem)}</div></div>
      <div class="opts" id="opts">${optsHTML(it)}</div>
      <div id="below"></div>
    </div></div>`;
}
function optsHTML(it) {
  return Object.keys(it.options).map(k => `<div class="opt" data-k="${k}" dir="${dir(it.options[k])}"><div class="fill"></div><div class="let">${k}</div>
    <div class="txt">${esc(it.options[k])}</div><div class="pct"><span class="n">0%</span><small class="c">0</small></div></div>`).join('');
}
function paintBars(counts, correct, show) {
  const total = Object.values(counts || {}).reduce((a, b) => a + b, 0);
  document.querySelectorAll('#opts .opt').forEach(o => {
    const k = o.dataset.k, n = (counts && counts[k]) || 0, p = total ? Math.round(n * 100 / total) : 0;
    o.querySelector('.fill').style.width = (show ? p : 0) + '%';
    o.querySelector('.pct .n').textContent = p + '%';
    o.querySelector('.pct .c').textContent = n + (n === 1 ? ' vote' : ' votes');
    o.classList.toggle('showpct', !!show);
    if (correct) {
      o.classList.toggle('correct', k === correct); o.classList.toggle('dim', k !== correct);
      if (k === correct && !o.querySelector('.tick')) o.querySelector('.pct').insertAdjacentHTML('beforebegin', '<span class="tick">✓</span>');
    }
  });
  return total;
}

function renderTrainer() {
  const d = T.data, s = d.state, it = d.item;
  setAccent(it ? it.accent : '#188CCD');
  if (s.phase === 'lobby') {
    const url = joinUrl(T.runId);
    setApp(ctrlBar(d, '<button class="btn orange" id="mainBtn" data-op="next">Start first question →</button>') + `
      <div class="lobbystage stagger"><div class="glass strong qrbox"><div class="eyebrow">Join the session</div><div class="qr">${qrImg(url) || '<div class="empty">QR unavailable — share the link</div>'}</div>
        <div class="muted" style="font-size:12px;font-weight:700;letter-spacing:.1em">SESSION CODE</div><div class="joincode">${esc(T.runId)}</div>
        <div class="link">${esc(url)}</div><button class="btn block" id="cpl">Copy link</button></div>
      <div class="glass strong people"><div class="row" style="justify-content:space-between;align-items:flex-end"><div><div class="eyebrow">Waiting room</div><div class="h2">Participants ready</div></div>
        <div class="bigcount" id="bc">0</div></div><div class="cloud" id="cloud"></div>
        <p class="muted" style="font-size:13px;margin-top:12px">Names appear here as people join. Start when you're ready — late joiners can still come in.</p></div></div>`);
    $('#cpl').onclick = () => copy(url);
    T.shown = {}; patchTrainer();
  } else if (s.phase === 'open' || s.phase === 'revealed') {
    const label = s.phase === 'open' ? 'Reveal answer' : (s.idx + 1 >= d.outline.length ? 'Finish activity →' : 'Next →');
    const op = s.phase === 'open' ? 'reveal' : 'next';
    setApp(ctrlBar(d, `<button class="btn ${s.phase === 'open' ? 'orange' : 'acc'}" id="mainBtn" data-op="${op}">${label}</button><span class="kbd"><b>→</b></span>`) + stageHTML(it));
    $('#below').innerHTML = `<div class="glass counter"><div class="ring" id="ring"><b id="ringT">0%</b></div><div><div class="big"><span id="ans">0</span> <span class="muted" style="font-size:18px">/ <span id="tot">0</span></span></div>
      <div class="lbl">${s.phase === 'open' ? 'participants answered · voting is open' : 'answered · results revealed'}</div></div>
      ${s.phase === 'revealed' && it.explanation ? `<div style="flex:1;margin-left:12px;font-size:14px" dir="auto">${esc(it.explanation)}</div>` : ''}</div>`;
    patchTrainer();
  } else if (s.phase === 'reflection') {
    const label = s.idx + 1 >= d.outline.length ? 'Finish activity →' : 'Next →';
    setApp(ctrlBar(d, `<button class="btn acc" id="mainBtn" data-op="next">${label}</button><span class="kbd"><b>→</b></span>`) + `
      <div class="glass strong refl"><div class="round-title"><b>ASK TO UNMASK - ${esc((it.round || '').toUpperCase())} ROUND</b></div>
      <div class="row" style="justify-content:space-between;margin-bottom:10px"><div class="h2" style="color:var(--orange)">${esc(it.title)}</div>
        <button class="btn ghost sm" id="revealAll">Reveal all concerns</button></div>
      <div class="cards">${(it.cards || []).map((c, i) => `<div class="rcard flip" style="animation-delay:${i * 90}ms"><div class="quote" dir="${dir(c.answer)}">“${esc(c.answer)}”</div>
        ${c.img ? `<img src="${img(c.img)}" alt="">` : ''}<div class="lab" title="Click to reveal">${esc(c.concern)}</div></div>`).join('')}</div>
      <p class="muted" style="font-size:12px;margin-top:14px">Ask the room first, then click a card to reveal the likely concern. Participants see a discussion screen.</p></div>`);
    document.querySelectorAll('.rcard').forEach(c => c.onclick = () => c.classList.add('open'));
    $('#revealAll').onclick = () => document.querySelectorAll('.rcard').forEach((c, i) => setTimeout(() => c.classList.add('open'), i * 120));
  } else if (s.phase === 'ended') {
    setApp(ctrlBar(d, '<button class="btn" id="resBtn">Full results</button>') + `<div class="glass strong" style="padding:26px"><div class="eyebrow" style="color:var(--orange)">Activity complete</div>
      <div class="h1">Final leaderboard</div><div id="finalLb"><div class="empty"><span class="spinner" style="margin:auto"></span></div></div></div>`);
    $('#resBtn').onclick = () => showResults(T.runId);
    loadLB(true).then(() => { const f = $('#finalLb'); if (f) f.innerHTML = LB.rows.length ? podiumHTML(LB.rows) + '<div class="cols2" style="margin-top:16px">' + rowsHTML(LB.rows) + '</div>' : '<div class="empty">No answers recorded.</div>'; }).catch(handleErr);
  }
  bindCtrl();
}

function patchTrainer() {
  const d = T.data, s = d.state;
  const pc = $('#pc'); if (pc) pc.textContent = d.participants.length;
  if (s.phase === 'lobby') {
    const cloud = $('#cloud'); if (!cloud) return;
    T.shown = T.shown || {};
    d.participants.forEach(p => { if (!T.shown[p.k]) { T.shown[p.k] = 1; cloud.insertAdjacentHTML('beforeend', `<span class="pname" dir="auto">${esc(p.n)}</span>`); } });
    countUp($('#bc'), d.participants.length, 500);
  } else if (s.phase === 'open' || s.phase === 'revealed') {
    const counts = s.phase === 'open' ? d.live : (s.reveal && s.reveal.counts);
    const total = paintBars(counts || {}, s.phase === 'revealed' ? s.reveal.correct : '', true);
    const tot = d.participants.length;
    countUp($('#ans'), total, 500); $('#tot').textContent = tot;
    const p = tot ? Math.round(total * 100 / tot) : 0;
    $('#ring').style.background = `conic-gradient(var(--acc) ${p}%, rgba(34,57,116,.08) 0)`; $('#ringT').textContent = p + '%';
  }
}

async function showResults(runId) {
  Poller.stop(); unmountFab(); setAccent('#188CCD');
  T.auth = T.auth || store.get('atu_trainer');
  trainerTop(`<span class="chip">${esc(runId)}</span>`);
  setApp('<div class="center"><span class="spinner"></span></div>');
  try {
    const r = await api('results', { token: T.auth.token, runId });
    LB.me = null;
    setApp(`<div class="row" style="justify-content:space-between;margin-bottom:18px"><div><div class="eyebrow">Results</div><div class="h1">${esc(runId)}</div></div>
      <div class="row"><a class="btn ghost" href="${esc(boardUrl(runId))}" target="_blank" rel="noopener">Projector board</a><button class="btn" id="back">← All runs</button></div></div>
      <div class="board"><div class="glass strong" style="padding:22px"><div class="h2">Leaderboard</div>${r.leaderboard.length ? podiumHTML(r.leaderboard) + rowsHTML(r.leaderboard) : '<div class="empty">No participants yet.</div>'}</div>
      <div>${r.items.map(q => {
        const acc = q.answered ? Math.round(q.correct * 100 / q.answered) : 0;
        return `<div class="glass qstat" style="--acc:${esc(q.accent)}"><div class="row" style="justify-content:space-between"><b>${esc(q.id)} · ${esc(q.round)}</b><span class="muted" style="font-size:13px">${q.answered} answered</span></div>
          <div class="muted" style="font-size:13px;margin-top:4px">${esc(q.stem)}</div><div class="accbar"><i style="width:${acc}%"></i></div>
          <div class="row" style="justify-content:space-between"><div class="dist">${Object.keys(q.counts).map(k => `<span class="${k === q.correctLetter ? 'c' : ''}">${k}: ${q.counts[k]}</span>`).join('')}</div><b>${acc}% correct</b></div></div>`;
      }).join('')}</div></div>`);
    $('#back').onclick = goTrainerHome;
  } catch (e) { handleErr(e); goTrainerHome(); }
}

async function rejoinAndGo() {
  try {
    await api('join', { runId: L.runId, name: L.me.name, emp: L.me.emp || '', pid: L.me.pid }, true, 5);
    goLearnerLoop();
  } catch (e) {
    const m = e.message || '';
    if (/ended/i.test(m)) { goLearnerLoop(); return; }
    if (/not found/i.test(m)) { store.del(meKey(L.runId)); return showJoin('Session code not found.'); }
    handleErr(e); setTimeout(rejoinAndGo, 3000);
  }
}

function goLearnerLoop() {
  mountFab(L.runId, L.me.k);
  L.key = ''; L.v = '';
  setApp('<div class="center"><span class="spinner"></span></div>');
  Poller.start(learnerTick, () => CONFIG.POLL.learner);
}

async function learnerTick() {
  const r = await api('state', { runId: L.runId, v: L.v });
  const lbv = r.same ? r.lbv : r.state.lbv;
  if (lbv !== LB.lbv) setTimeout(() => loadLB().then(() => paintScore()).catch(() => {}), Math.random() * 1500);
  if (r.same) return;
  L.v = r.state.v; L.state = r.state; L.item = r.item; L.total = r.total;
  const key = r.state.v + '|' + r.state.phase + '|' + r.state.idx;
  if (key !== L.key) { L.key = key; renderLearner(); }
}

function myRow() { return LB.rows.find(x => x.k === L.me.k); }
function scoreBarHTML() {
  return `<div class="scorebar"><div class="glass"><b id="myPts">${myRow() ? myRow().p : 0}</b><span>Points</span></div><div class="glass"><b id="myRank">${myRow() ? '#' + myRow().r : '–'}</b><span>Rank</span></div>
    <div class="glass"><b>${L.state.idx >= 0 ? Math.min(L.state.idx + 1, L.total) : 0}<span style="font-size:14px;color:var(--muted)">/${L.total}</span></b><span>Step</span></div></div>`;
}
function paintScore() {
  const r = myRow(); if (!r) return;
  const p = $('#myPts'); if (p) countUp(p, r.p, 700);
  const k = $('#myRank'); if (k) k.textContent = '#' + r.r;
}

function renderLearner() {
  const s = L.state, it = L.item;
  setAccent(it ? it.accent : '#188CCD');
  if (s.phase === 'lobby') {
    setApp(`<div class="lwrap"><div class="glass strong ready"><div class="check breath">${ICON.check}</div>
      <div class="h1" dir="auto">You're in, ${esc(L.me.name.split(' ')[0])}!</div>
      <p class="muted" style="margin:10px 0 20px">Waiting for the trainer to start the first question <span class="dots"><i></i><i></i><i></i></span></p>
      <span class="chip">Session ${esc(L.runId)}</span></div></div>`);
  } else if (s.phase === 'open') {
    const mine = L.me.answers && L.me.answers[it.id];
    setApp(`<div class="lwrap">${scoreBarHTML()}<div class="glass strong lcard">
      <div class="eyebrow">${esc(it.round)} round${it.type === 'FollowUp' ? ' · Follow-up' : ''}</div>
      ${it.statement ? `<div class="lhead" style="margin-top:10px"><div class="avatar"><img src="${img(it.customerImg)}" alt=""></div><div class="bubble" style="margin:0;flex:1;font-size:15px" dir="${dir(it.statement)}">${esc(it.statement)}</div></div>` : ''}
      <div class="ask" style="margin-top:12px">${it.pharmacistImg ? `<div class="avatar" style="width:48px;height:48px"><img src="${img(it.pharmacistImg)}" alt=""></div>` : ''}<div class="askbubble" style="font-size:15px" dir="${dir(it.stem)}">${esc(it.stem)}</div></div>
      <div class="opts lopts ${mine ? 'locked' : ''}" id="opts">${optsHTML(it)}</div>
      <div id="lstat"></div></div></div>`);
    if (mine) markMine(mine, true);
    else document.querySelectorAll('#opts .opt').forEach(o => o.onclick = ev => submitAnswer(it.id, o.dataset.k, ev));
  } else if (s.phase === 'revealed') {
    const mine = L.me.answers && L.me.answers[it.id];
    const ok = mine && mine === it.correct;
    setApp(`<div class="lwrap">${scoreBarHTML()}
      <div class="verdict ${ok ? 'ok' : 'no'}"><span class="em">${ok ? '🎯' : mine ? '💡' : '⏱️'}</span><div>${ok ? 'Great question choice!' : mine ? 'Not this time — see the best question below.' : 'You didn\'t answer this one.'}</div><span class="pts">${ok ? '+1' : '+0'}</span></div>
      <div class="glass strong lcard"><div class="eyebrow">${esc(it.round)} round · Results</div>
      <div class="askbubble" style="font-size:15px;margin:10px 0 14px" dir="${dir(it.stem)}">${esc(it.stem)}</div>
      <div class="opts lopts locked" id="opts">${optsHTML(it)}</div>
      ${it.explanation ? `<div class="wait" dir="auto">${esc(it.explanation)}</div>` : ''}</div></div>`);
    paintBars((s.reveal && s.reveal.counts) || {}, it.correct, true);
    if (mine) markMine(mine, false);
    if (ok) { const v = $('.verdict'); const b = v.getBoundingClientRect(); setTimeout(() => sparkle(b.right - 40, b.top + b.height / 2), 250); }
  } else if (s.phase === 'reflection') {
    setApp(`<div class="lwrap">${scoreBarHTML()}<div class="glass strong ready"><div class="check breath" style="background:linear-gradient(140deg,var(--orange),#f6b04d)"><span style="font-size:40px">💬</span></div>
      <div class="h2">Discussion time</div><p class="muted" style="margin-top:8px">Follow your trainer's screen — ${esc(it.round)} round reflection.</p>
      <p class="muted" style="margin-top:6px">Next question is coming <span class="dots"><i></i><i></i><i></i></span></p></div></div>`);
  } else if (s.phase === 'ended') {
    setApp(`<div class="lwrap"><div class="glass strong lcard"><div class="eyebrow" style="color:var(--orange)">Activity complete</div><div class="h1">Final leaderboard</div>
      <div id="finalLb"><div class="empty"><span class="spinner" style="margin:auto"></span></div></div></div></div>`);
    loadLB(true).then(() => {
      const f = $('#finalLb'); if (!f) return;
      const me = myRow();
      f.innerHTML = (me ? `<div class="verdict ok" style="margin-top:14px"><span class="em">🏅</span><div>You finished <b>#${me.r}</b> with <b>${me.p}</b> point${me.p === 1 ? '' : 's'}.</div></div>` : '') +
        podiumHTML(LB.rows) + rowsHTML(LB.rows);
      if (me && me.r <= 3) sparkle(innerWidth / 2, innerHeight / 3, 40);
    }).catch(() => {});
  }
}

function markMine(k, waiting) {
  document.querySelectorAll('#opts .opt').forEach(o => {
    if (o.dataset.k === k) { o.classList.add('mine'); if (!o.querySelector('.mine-tag')) o.insertAdjacentHTML('beforeend', '<span class="mine-tag">Your answer</span>'); }
    else if (waiting) o.classList.add('dim');
  });
  if (waiting) $('#lstat').innerHTML = `<div class="wait"><span class="dots"><i></i><i></i><i></i></span> Answer locked in. Waiting for the trainer to reveal…</div>`;
}

async function submitAnswer(itemId, k, ev) {
  if (L.sending || (L.me.answers && L.me.answers[itemId])) return;
  L.sending = true;
  $('#opts').classList.add('locked');
  markMine(k, true);
  const send = () => api('answer', { runId: L.runId, pid: L.me.pid, itemId, choice: k }, true, 4);
  try {
    let r;
    try { r = await send(); }
    catch (e) {
      if (e.message !== 'NOJOIN') throw e;
      await api('join', { runId: L.runId, name: L.me.name, emp: L.me.emp || '', pid: L.me.pid }, true, 5);
      r = await send();
    }
    L.me.answers = L.me.answers || {}; L.me.answers[itemId] = r.choice; store.set(meKey(L.runId), L.me);
    if (r.choice !== k) { document.querySelectorAll('#opts .opt').forEach(o => { o.classList.remove('mine', 'dim'); const t = o.querySelector('.mine-tag'); if (t) t.remove(); }); markMine(r.choice, true); }
  } catch (e) {
    handleErr(e);
    if (/closed/i.test(e.message || '')) { Poller.now(); }
    else { // allow retry
      $('#opts').classList.remove('locked'); $('#lstat').innerHTML = '';
      document.querySelectorAll('#opts .opt').forEach(o => { o.classList.remove('mine', 'dim'); const t = o.querySelector('.mine-tag'); if (t) t.remove(); });
    }
  } finally { L.sending = false; }
}

/* ============================ projector board ============================ */
function boardStart(runId) {
  runId = runId.toUpperCase(); LB.runId = runId; LB.me = null;
  setTop(`<span class="chip"><span class="dot"></span>${esc(runId)}</span>`);
  setApp(`<div class="board"><div class="glass strong" style="padding:28px"><div class="eyebrow" style="color:var(--orange)">Live leaderboard</div><div class="h1">Session ${esc(runId)}</div>
    <div id="pod"></div></div><div class="glass strong" style="padding:22px"><div class="row" style="justify-content:space-between;margin-bottom:12px"><div class="h2">Rankings</div><span class="chip" id="cnt">0 players</span></div>
    <div id="list" class="cols2"></div><div class="row" style="margin-top:18px;gap:16px"><div class="qr" style="width:120px;margin:0;padding:8px">${qrImg(joinUrl(runId))}</div>
    <div class="muted" style="font-size:13px">Late? Scan to join<br><b style="font-size:20px;color:var(--navy)">${esc(runId)}</b></div></div></div></div>`);
  let last = '';
  Poller.start(async () => {
    const r = await api('board', { runId, lbv: LB.lbv });
    if (r.same) return;
    LB.rows = r.rows; LB.lbv = r.lbv;
    const sig = JSON.stringify(r.rows.map(x => [x.k, x.p]));
    if (sig === last) return; last = sig;
    $('#pod').innerHTML = r.rows.length ? podiumHTML(r.rows) : '<div class="empty">Scores appear after the first reveal.</div>';
    $('#list').innerHTML = rowsHTML(r.rows.slice(0, 40));
    $('#cnt').textContent = r.rows.length + ' players';
  }, () => CONFIG.POLL.board);
}

/* ============================ boot ============================ */
document.addEventListener('DOMContentLoaded', function boot() {
  if (/PASTE_YOUR/.test(CONFIG.API_URL)) {
    setApp('<div class="center"><div class="glass strong hero"><div class="h2">Setup needed</div><p class="muted" style="margin-top:8px">Paste your Apps Script Web App URL into <b>CONFIG.API_URL</b> in index.html.</p></div></div>');
    return;
  }
  const run = params.get('run'), view = params.get('view');
  if (run && view === 'board') return boardStart(run);
  if (run) return learnerStart(run);
  const t = store.get('atu_trainer');
  if (t && t.token && Date.now() - (t.at || 0) < 6 * 3600 * 1000) {
    T.auth = t; const r = store.get('atu_trun');
    return r ? openRun(r) : goTrainerHome();
  }
  goLanding();
});
</script>
</body>
</html>
