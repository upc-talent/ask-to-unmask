:root{
  --navy:#223974; --orange:#F8991D; --blue:#188CCD; --teal:#00A99B; --green:#1E9E6A;
  --ink:#1b2b55; --muted:#5f6f92; --line:rgba(34,57,116,.12);
  --glass:rgba(255,255,255,.58); --glass-strong:rgba(255,255,255,.8); --glass-border:rgba(255,255,255,.75);
  --shadow:0 12px 40px rgba(34,57,116,.12), 0 2px 6px rgba(34,57,116,.06);
  --acc:#188CCD; --r:22px; --ease:cubic-bezier(.22,.8,.26,1);
  font-family:'Bw Modelica','Noto Sans Arabic',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{color:var(--ink);background:#EDF3FA;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
img{display:block;max-width:100%}
[dir=rtl]{font-family:'Noto Sans Arabic','Bw Modelica',sans-serif}

/* ambient background */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:linear-gradient(160deg,#F4F8FC 0%,#E8F1FA 45%,#EEF7F6 100%)}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.42;animation:drift 26s ease-in-out infinite alternate}
.b1{width:46vmax;height:46vmax;background:var(--blue);top:-18vmax;left:-12vmax}
.b2{width:34vmax;height:34vmax;background:var(--orange);bottom:-16vmax;right:-8vmax;opacity:.28;animation-duration:32s}
.b3{width:30vmax;height:30vmax;background:var(--teal);top:30%;right:12%;opacity:.25;animation-duration:38s}
.b4{width:26vmax;height:26vmax;background:var(--navy);bottom:-6vmax;left:18%;opacity:.16;animation-duration:44s}
.pattern{position:absolute;right:-6vmax;top:8vh;width:52vmax;opacity:.5;animation:float 18s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(6vmax,4vmax) scale(1.12)}}
@keyframes float{to{transform:translateY(-2.5vmax) rotate(4deg)}}

.glass{background:var(--glass);backdrop-filter:blur(22px) saturate(170%);-webkit-backdrop-filter:blur(22px) saturate(170%);
  border:1px solid var(--glass-border);border-radius:var(--r);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.85)}
.glass.strong{background:var(--glass-strong)}

/* layout */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:12px clamp(14px,3vw,28px);
  background:rgba(255,255,255,.5);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);border-bottom:1px solid rgba(255,255,255,.7)}
.top .logo{height:34px;width:auto}
.top .brand{display:flex;flex-direction:column;line-height:1.1;padding-left:14px;border-left:1px solid var(--line)}
.top .brand b{font-size:15px;letter-spacing:.06em;color:var(--navy);font-weight:700}
.top .brand span{font-size:11px;color:var(--muted);letter-spacing:.04em}
.top .sp{flex:1}
.wrap{max-width:1320px;margin:0 auto;padding:clamp(14px,2.4vw,28px)}
.foot{text-align:center;font-size:11px;color:var(--muted);padding:18px 0 110px;letter-spacing:.05em}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer;border-radius:14px;padding:12px 20px;font-weight:700;font-size:15px;
  background:var(--navy);color:#fff;box-shadow:0 8px 22px rgba(34,57,116,.25);transition:transform .25s var(--ease),box-shadow .25s,opacity .2s,background .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(34,57,116,.3)}
.btn:active{transform:translateY(0) scale(.98)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.acc{background:var(--acc);box-shadow:0 8px 22px color-mix(in srgb,var(--acc) 35%,transparent)}
.btn.orange{background:var(--orange);box-shadow:0 8px 22px rgba(248,153,29,.35)}
.btn.ghost{background:rgba(255,255,255,.6);color:var(--navy);box-shadow:none;border:1px solid var(--glass-border)}
.btn.ghost:hover{background:rgba(255,255,255,.9)}
.btn.sm{padding:8px 14px;font-size:13px;border-radius:11px}
.btn.lg{padding:16px 28px;font-size:17px;border-radius:16px}
.btn.block{width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:700;background:rgba(255,255,255,.65);border:1px solid var(--glass-border);color:var(--navy)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--teal);animation:ping 2s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(0,169,155,.5)}70%{box-shadow:0 0 0 8px rgba(0,169,155,0)}100%{box-shadow:0 0 0 0 rgba(0,169,155,0)}}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.field input{width:100%;padding:14px 16px;border-radius:14px;border:1px solid rgba(34,57,116,.14);background:rgba(255,255,255,.75);outline:none;font-size:16px;transition:border .2s,box-shadow .2s}
.field input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(24,140,205,.15)}
.code-input{text-align:center;letter-spacing:.25em;font-weight:700;text-transform:uppercase}
.muted{color:var(--muted)}
.h1{font-size:clamp(26px,3.6vw,40px);font-weight:700;color:var(--navy);letter-spacing:-.01em}
.h2{font-size:clamp(19px,2.2vw,24px);font-weight:700;color:var(--navy)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.center{display:grid;place-items:center;min-height:calc(100vh - 140px)}
.view{animation:viewIn .55s var(--ease) both}
@keyframes viewIn{from{opacity:0;transform:translateY(14px) scale(.99)}to{opacity:1;transform:none}}
.stagger>*{animation:viewIn .5s var(--ease) both}
.stagger>*:nth-child(2){animation-delay:.06s}.stagger>*:nth-child(3){animation-delay:.12s}.stagger>*:nth-child(4){animation-delay:.18s}

/* landing */
.hero{width:min(440px,100%);padding:30px 28px}
.hero .logo{height:46px;margin:0 auto 14px}
.hero .title{text-align:center;margin-bottom:6px}
.hero .sub{text-align:center;color:var(--muted);font-size:14px;margin-bottom:22px}
.seg{display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:14px;background:rgba(34,57,116,.07);margin-bottom:20px;position:relative}
.seg button{border:0;background:none;padding:10px;border-radius:11px;font-weight:700;font-size:14px;cursor:pointer;color:var(--muted);position:relative;z-index:1;transition:color .3s}
.seg button.on{color:var(--navy)}
.seg .pill{position:absolute;top:4px;bottom:4px;width:calc(50% - 4px);left:4px;border-radius:11px;background:#fff;box-shadow:0 4px 12px rgba(34,57,116,.12);transition:transform .4s var(--ease)}
.seg.r .pill{transform:translateX(100%)}

/* trainer home */
.grid-lobby{display:grid;grid-template-columns:minmax(280px,360px) 1fr;gap:22px;align-items:start}
.newcard{padding:28px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.newcard::after{content:"";position:absolute;width:220px;height:220px;right:-70px;bottom:-90px;border-radius:50%;background:radial-gradient(circle,rgba(248,153,29,.35),transparent 70%)}
.runs{display:grid;gap:12px}
.runrow{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;padding:16px 18px}
.runid{font-weight:700;font-size:18px;color:var(--navy);letter-spacing:.04em}
.pill-status{font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;letter-spacing:.05em;text-transform:uppercase}
.pill-status.Active{background:rgba(0,169,155,.14);color:#007d72}
.pill-status.Ended{background:rgba(34,57,116,.08);color:var(--muted)}
.mini-progress{height:6px;border-radius:6px;background:rgba(34,57,116,.08);overflow:hidden;margin-top:8px;max-width:260px}
.mini-progress i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--teal));border-radius:6px}

/* trainer control bar + navigation */
.ctrlbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.navbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px;padding:10px 12px}
.stepper{display:flex;align-items:center;gap:5px;flex-wrap:wrap;flex:1;min-width:240px}
.step{width:13px;height:13px;border-radius:50%;border:0;cursor:pointer;padding:0;background:color-mix(in srgb,var(--c) 28%,white);transition:all .35s var(--ease);position:relative}
.step:hover{transform:scale(1.25)}
.step.d{border-radius:3px;transform:rotate(45deg);width:10px;height:10px;margin:0 2px}
.step.d:hover{transform:rotate(45deg) scale(1.25)}
.step.done{background:var(--c)}
.step.now{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--c)}
.step.sep{width:1px;height:16px;border-radius:0;background:var(--line);cursor:default;margin:0 4px}
.jump{padding:8px 12px;border-radius:11px;border:1px solid var(--glass-border);background:rgba(255,255,255,.7);font-size:13px;font-weight:600;color:var(--navy);max-width:260px}
.kbd{font-size:11px;color:var(--muted)}
.kbd b{border:1px solid var(--line);border-radius:6px;padding:1px 6px;background:rgba(255,255,255,.7)}

/* live counter */
.counter{display:flex;align-items:center;gap:16px;margin-top:18px;padding:14px 18px}
.ring{position:relative;width:58px;height:58px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--acc) 0%,rgba(34,57,116,.08) 0)}
.ring::before{content:"";position:absolute;width:44px;height:44px;border-radius:50%;background:#fff}
.ring b{position:relative;font-size:13px;font-weight:700;color:var(--navy)}
.counter .big{font-size:28px;font-weight:700;color:var(--navy);line-height:1}
.counter .lbl{font-size:12px;color:var(--muted);font-weight:600}

/* lobby (share) */
.lobbystage{display:grid;grid-template-columns:minmax(280px,380px) 1fr;gap:22px}
.qrbox{padding:26px;text-align:center}
.qr{width:min(100%,260px);aspect-ratio:1;margin:12px auto;background:#fff;border-radius:18px;padding:14px;box-shadow:inset 0 0 0 1px var(--line)}
.qr img{width:100%;height:100%;image-rendering:pixelated}
.joincode{font-size:44px;font-weight:700;letter-spacing:.14em;color:var(--navy);margin:4px 0}
.link{font-size:12px;word-break:break-all;color:var(--muted);background:rgba(34,57,116,.05);padding:8px 10px;border-radius:10px;margin:10px 0}
.people{padding:26px;min-height:360px;display:flex;flex-direction:column}
.cloud{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;align-content:flex-start;flex:1}
.pname{padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.8);border:1px solid var(--glass-border);font-weight:600;font-size:14px;animation:pop .5s var(--ease) both}
.bigcount{font-size:64px;font-weight:700;color:var(--navy);line-height:1}

/* learner */
.lwrap{max-width:560px;margin:0 auto;padding:14px 14px 0}
.lcard{padding:18px}
.submitbar{position:sticky;bottom:0;z-index:30;margin:14px -14px 0;padding:12px 14px calc(12px + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.75);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid rgba(255,255,255,.9);display:flex;gap:10px;align-items:center}
.submitbar .hint{flex:1;font-size:13px;color:var(--muted);font-weight:600}
.wait{display:flex;align-items:center;gap:12px;padding:14px 16px;margin-top:14px;border-radius:16px;background:rgba(255,255,255,.7);font-weight:600}
.dots i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--acc);margin:0 2px;animation:bounce 1.2s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bounce{40%{transform:translateY(-6px);opacity:.6}}
.ready{text-align:center;padding:36px 26px}
.check{width:92px;height:92px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(140deg,var(--teal),var(--blue));box-shadow:0 14px 34px rgba(0,169,155,.35);animation:pop .7s var(--ease) both}
.check svg{width:46px;height:46px;stroke:#fff;stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:draw .6s .35s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.verdict{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:18px;margin-bottom:14px;font-weight:700;animation:viewIn .5s var(--ease) both}
.verdict.ok{background:linear-gradient(120deg,rgba(0,169,155,.16),rgba(24,140,205,.12));color:#006f66}
.verdict.no{background:rgba(248,153,29,.14);color:#9a5a05}
.verdict .em{font-size:30px}
.verdict .pts{margin-left:auto;font-size:22px;font-weight:700}
.scorebar{display:flex;gap:10px;margin-bottom:14px}
.scorebar .glass{flex:1;padding:12px 14px;text-align:center;border-radius:16px}
.scorebar b{display:block;font-size:24px;color:var(--navy);font-weight:700}
.scorebar span{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.08em;text-transform:uppercase}

/* leaderboard */
.fab-btn{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:40;width:62px;height:62px;border-radius:50%;border:0;cursor:pointer;
  background:linear-gradient(140deg,var(--orange),#f6b04d);color:#fff;box-shadow:0 12px 30px rgba(248,153,29,.45);display:grid;place-items:center;transition:transform .3s var(--ease)}
.fab-btn:hover{transform:translateY(-3px) scale(1.04)}
.fab-btn svg{width:28px;height:28px}
.fab-btn .badge{position:absolute;top:-4px;right:-4px;min-width:26px;height:26px;padding:0 6px;border-radius:13px;background:var(--navy);font-size:12px;font-weight:700;display:grid;place-items:center;border:2px solid #fff}
body.has-submit .fab-btn{bottom:calc(92px + env(safe-area-inset-bottom))}
.drawer-bg{position:fixed;inset:0;z-index:50;background:rgba(27,43,85,.25);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .35s}
.drawer-bg.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);z-index:51;transform:translateX(105%);transition:transform .5s var(--ease);border-radius:26px 0 0 26px;display:flex;flex-direction:column;padding:22px 20px 14px}
.drawer.on{transform:none}
.drawer .list{overflow:auto;flex:1;margin-top:12px;padding-right:4px}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:10px;margin:14px 0 6px}
.pod{text-align:center}
.pod .av{width:54px;height:54px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;font-weight:700;font-size:18px;color:#fff;box-shadow:0 8px 18px rgba(34,57,116,.18)}
.pod .nm{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.pod .bar{margin-top:8px;border-radius:16px 16px 8px 8px;display:flex;flex-direction:column;align-items:center;padding-top:10px;color:#fff;font-weight:700;animation:grow .9s var(--ease) both;transform-origin:bottom}
.pod .bar span{font-size:22px}.pod .bar small{font-size:11px;opacity:.9}
.pod.p1 .bar{height:120px;background:linear-gradient(var(--orange),#f7b354)}.pod.p1 .av{background:var(--orange);width:64px;height:64px}
.pod.p2 .bar{height:88px;background:linear-gradient(var(--blue),#4fb0e3);animation-delay:.12s}.pod.p2 .av{background:var(--blue)}
.pod.p3 .bar{height:66px;background:linear-gradient(var(--teal),#3cc3b7);animation-delay:.24s}.pod.p3 .av{background:var(--teal)}
@keyframes grow{from{transform:scaleY(0)}}
.lbrow{display:grid;grid-template-columns:38px 1fr auto;align-items:center;gap:10px;padding:11px 12px;border-radius:14px;margin-bottom:6px;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.7);animation:viewIn .45s var(--ease) both}
.lbrow .rk{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:13px;background:rgba(34,57,116,.07);color:var(--navy)}
.lbrow .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbrow .pt{font-weight:700;color:var(--navy);font-size:16px}
.lbrow.me{background:linear-gradient(120deg,rgba(248,153,29,.2),rgba(255,255,255,.8));border-color:rgba(248,153,29,.5)}
.lbrow.me .rk{background:var(--orange);color:#fff}
.empty{padding:30px;text-align:center;color:var(--muted)}
.board{display:grid;grid-template-columns:1.1fr 1fr;gap:24px;align-items:start}
.board .podium{margin-top:30px}
.board .pod.p1 .bar{height:210px}.board .pod.p2 .bar{height:160px}.board .pod.p3 .bar{height:120px}
.board .pod .av{width:80px;height:80px;font-size:26px}.board .pod.p1 .av{width:96px;height:96px}
.board .pod .nm{font-size:18px}
.board .lbrow{padding:13px 16px}.board .lbrow .nm{font-size:17px}.board .lbrow .pt{font-size:19px}
.cols2{columns:2;column-gap:12px}.cols2 .lbrow{break-inside:avoid}

/* results */
.qstat{padding:16px 18px;margin-bottom:12px}
.accbar{height:10px;border-radius:8px;background:rgba(34,57,116,.08);overflow:hidden;margin:10px 0 8px}
.accbar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--blue));border-radius:8px}
.dist{display:flex;gap:8px;flex-wrap:wrap}
.dist span{font-size:12px;font-weight:700;padding:4px 10px;border-radius:9px;background:rgba(34,57,116,.06)}
.dist span.c{background:rgba(0,169,155,.16);color:#007d72}

/* speed + streak */
.bonusline{display:flex;align-items:center;gap:8px;margin:-6px 0 14px;font-size:13px;font-weight:600;color:var(--muted);flex-wrap:wrap}
.bonusline b{color:#c8700b}
.speedwall{display:flex;gap:12px;flex-wrap:wrap;align-items:stretch;margin-top:16px}
.speedwall .ttl{display:flex;flex-direction:column;justify-content:center;padding:0 6px;font-weight:700;color:var(--navy);font-size:14px;line-height:1.3}
.spd{flex:1;min-width:170px;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.75);border:1px solid rgba(255,255,255,.9);animation:viewIn .5s var(--ease) both}
.spd:nth-child(3){animation-delay:.1s}.spd:nth-child(4){animation-delay:.2s}
.spd .md{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:none}
.spd.g1 .md{background:linear-gradient(140deg,#F8991D,#f7b354)}.spd.g2 .md{background:linear-gradient(140deg,#188CCD,#4fb0e3)}.spd.g3 .md{background:linear-gradient(140deg,#00A99B,#3cc3b7)}
.spd .nm{font-weight:700;color:var(--navy);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spd small{display:block;color:var(--muted);font-weight:600;font-size:12px}
.spd .bn{margin-left:auto;font-weight:700;color:#c8700b;font-size:18px}
.streakchip{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:linear-gradient(120deg,rgba(248,153,29,.2),rgba(255,255,255,.7));font-weight:700;color:#9a5a05;font-size:13px}
.breakdown{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.breakdown span{font-size:12px;font-weight:700;padding:4px 9px;border-radius:8px;background:rgba(255,255,255,.75);color:var(--navy)}
.breakdown span.hot{background:rgba(248,153,29,.18);color:#9a5a05}
.lbrow .fl{font-size:12px;font-weight:700;color:#c8700b;margin-left:6px}
/* modal + toast */
.modal-bg{position:fixed;inset:0;z-index:60;background:rgba(27,43,85,.3);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;animation:fade .3s both}
@keyframes fade{from{opacity:0}}
.modal{width:min(460px,100%);padding:26px;animation:viewIn .45s var(--ease) both}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,30px);z-index:70;padding:12px 18px;border-radius:14px;background:rgba(27,43,85,.92);color:#fff;font-weight:600;font-size:14px;opacity:0;transition:all .4s var(--ease);pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.spinner{width:22px;height:22px;border-radius:50%;border:3px solid rgba(34,57,116,.15);border-top-color:var(--blue);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.net{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:30;font-size:12px;font-weight:700;padding:6px 12px;border-radius:999px;background:rgba(248,153,29,.95);color:#fff;display:none}
.net.on{display:block;animation:fade .3s}
.spark{position:fixed;pointer-events:none;z-index:80;width:8px;height:8px;border-radius:2px;animation:spark 1.4s var(--ease) forwards}
@keyframes spark{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}

@media (max-width:900px){
  .lobbystage,.grid-lobby,.board,.disc,.referral{grid-template-columns:1fr}
  .arena{flex-wrap:wrap;gap:12px}.arena .vsdot{display:none}.arena .pcard{flex:1 1 45%}
  .cols2{columns:1}
}
@media (max-width:560px){
  .top .brand{display:none}.top .logo{height:28px}
  .runrow{grid-template-columns:1fr;gap:10px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.tstage{padding:24px}

@keyframes pop{from{transform:scale(0)}60%{transform:scale(1.15)}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}
/* ---------- ASK TO UNMASK screens ---------- */
.tstage{padding:24px}
.cstage{display:grid;grid-template-columns:minmax(240px,31%) 1fr;gap:26px;align-items:start}
.round-title{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.round-title::before{content:"";width:6px;height:30px;border-radius:4px;background:linear-gradient(var(--acc),var(--orange))}
.round-title b{font-size:clamp(18px,2vw,24px);font-weight:700;color:var(--navy);letter-spacing:.02em}
.kind{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:5px 11px;border-radius:999px;background:color-mix(in srgb,var(--acc) 14%,white);color:var(--acc)}
.kind.fu{background:rgba(248,153,29,.16);color:#c8700b}

.bubble{position:relative;padding:18px 20px 18px 22px;border-radius:20px;background:color-mix(in srgb,var(--acc) 12%,rgba(255,255,255,.78));border:1px solid rgba(255,255,255,.85);font-size:clamp(15px,1.4vw,18px);line-height:1.75;font-weight:600;margin-bottom:18px}
.bubble::after{content:"";position:absolute;left:44px;bottom:-12px;width:24px;height:24px;border-right:1px solid rgba(255,255,255,.85);border-bottom:1px solid rgba(255,255,255,.85);transform:rotate(45deg);border-radius:0 0 6px 0;background:color-mix(in srgb,var(--acc) 12%,rgba(255,255,255,.78))}
.bubble .q{position:absolute;top:-6px;left:12px;font-size:40px;line-height:1;color:var(--orange);font-family:Georgia,serif}
.reply{position:relative;margin:4px 0 18px;padding:14px 18px 12px;border-radius:16px;background:#fff;border:2px solid var(--orange);color:#c8700b;font-weight:700;font-size:clamp(15px,1.4vw,18px);line-height:1.6;animation:viewIn .6s var(--ease) both;box-shadow:0 8px 20px rgba(248,153,29,.18)}
.reply .ans{position:absolute;top:-12px;left:14px;background:var(--navy);color:#fff;font-size:10px;font-weight:700;letter-spacing:.06em;padding:3px 9px;border-radius:999px;font-family:'Bw Modelica',sans-serif}
.u-figure{position:relative;width:min(100%,290px);aspect-ratio:720/820;margin:4px auto 0}
.u-figure img{position:absolute;left:0;width:100%}
.u-figure .u{bottom:0;height:85.9%;object-fit:fill}
.u-figure .p{top:0;height:100%;object-fit:contain;animation:rise .9s var(--ease) both}

.ask{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.avatar{width:64px;height:64px;border-radius:50%;overflow:hidden;flex:none;background:#fff;border:3px solid #fff;box-shadow:0 6px 18px rgba(34,57,116,.15)}
.avatar img{width:100%;height:100%;object-fit:cover;object-position:top}
.askbubble{flex:1;padding:14px 20px;border-radius:16px;background:var(--acc);color:#fff;font-weight:700;font-size:clamp(15px,1.5vw,19px);box-shadow:0 10px 24px color-mix(in srgb,var(--acc) 30%,transparent)}
.askbubble small{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.85;margin-bottom:2px}

/* options (rows) */
.aopts{display:grid;gap:12px}
.aopt{position:relative;display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:16px;overflow:hidden;background:rgba(255,255,255,.66);border:1.5px solid rgba(255,255,255,.9);transition:all .45s var(--ease);text-align:start;width:100%;cursor:default}
.aopt .pc-let{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:700;color:#fff;background:var(--acc);position:relative;z-index:1;font-family:'Bw Modelica',sans-serif}
.aopt .txt{flex:1;font-size:clamp(14px,1.35vw,17px);line-height:1.65;font-weight:600;position:relative;z-index:1}
.aopt .pc-bar{display:contents}
.aopt .pc-bar i{display:none;position:absolute;top:0;bottom:0;right:0;width:0;z-index:0;background:linear-gradient(270deg,color-mix(in srgb,var(--acc) 26%,transparent),color-mix(in srgb,var(--acc) 10%,transparent));transition:width .9s var(--ease)}
.aopt[dir=ltr] .pc-bar i{left:0;right:auto}
.aopt .pc-bar span{display:none;flex:none;flex-direction:column;align-items:flex-end;min-width:60px;position:relative;z-index:1;font-family:'Bw Modelica',sans-serif}
.aopt .pc-bar b{font-size:15px;color:var(--navy)}
.aopt .pc-bar small{font-size:11px;font-weight:600;color:var(--muted)}
.bars .aopt .pc-bar i{display:block}
.bars .aopt .pc-bar span{display:flex}
.aopt .tick{flex:none;width:26px;height:26px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:900;position:relative;z-index:1;animation:pop .5s var(--ease) both}
.aopt.correct{border-color:var(--acc);background:rgba(255,255,255,.92);box-shadow:0 10px 28px color-mix(in srgb,var(--acc) 25%,transparent)}
.aopt.correct .pc-let{background:var(--teal)}
.aopt.dim{opacity:.55;filter:saturate(.6)}
.aopt .mine{display:none;position:absolute;bottom:0;z-index:2;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--orange);color:#fff;padding:2px 8px;border-radius:8px 8px 0 0}
.aopt[dir=rtl] .mine{left:14px}.aopt[dir=ltr] .mine{right:14px}
.aopt.sel{border-color:var(--orange);background:rgba(255,255,255,.95);padding-bottom:24px}
.aopt.sel .pc-let{background:var(--orange)}
.aopt.sel .mine{display:block}
.lopts .aopt{cursor:pointer;min-height:64px}
.lopts:not(.locked) .aopt:hover{transform:translateY(-2px);background:rgba(255,255,255,.88)}
.lopts.locked .aopt{cursor:default}

/* reflection cards */
.rhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.rcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px}
.rcard{padding:16px;border-radius:20px;background:color-mix(in srgb,var(--acc) 9%,rgba(255,255,255,.78));border:2px solid rgba(255,255,255,.9);display:flex;flex-direction:column;gap:12px;animation:viewIn .6s var(--ease) both;text-align:start;font:inherit;color:inherit}
.rcard.hl{border-color:var(--orange);box-shadow:0 10px 26px rgba(248,153,29,.25)}
.rcard .hltag{align-self:flex-start;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--orange);color:#fff;padding:3px 9px;border-radius:999px}
.rcard .quote{font-size:15px;line-height:1.75;font-weight:600;min-height:50px}
.rcard img{width:100%;max-width:160px;aspect-ratio:1.05;object-fit:cover;border-radius:16px;margin:0 auto;box-shadow:0 8px 20px rgba(34,57,116,.12)}
.rcard .lab{font-weight:700;color:var(--navy);padding-left:10px;border-left:4px solid var(--acc);font-size:15px;line-height:1.35;min-height:22px;transition:filter .5s,opacity .5s}
.rcard .lab.blur{filter:blur(7px);opacity:.5}
.rcard .lab.wait{color:var(--muted);font-weight:600;border-left-style:dashed;font-size:13px}
button.rcard{cursor:pointer}

/* key tip */
.tipflow{display:flex;align-items:center;justify-content:center;gap:clamp(12px,3vw,44px);padding:34px 10px 20px;flex-wrap:wrap}
.tstep{display:flex;flex-direction:column;align-items:center;gap:16px;animation:viewIn .7s var(--ease) both;text-align:center}
.tstep:nth-child(3){animation-delay:.25s}.tstep:nth-child(5){animation-delay:.5s}
.tstep .ic{width:clamp(96px,11vw,140px);height:clamp(96px,11vw,140px);border-radius:50%;display:grid;place-items:center;background:#E7EEF7}
.tstep .ic svg{width:52%;height:52%}
.tstep.c1 .ic{background:#FDE6D3}
.tstep.hl .ic{background:var(--teal);box-shadow:0 0 0 12px rgba(0,169,155,.14);animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 0 0 20px rgba(0,169,155,.06)}}
.tstep .t{font-weight:700;font-size:clamp(18px,2.3vw,30px);color:var(--navy)}
.tstep.hl .t{color:var(--teal)}
.tarrow{font-size:clamp(28px,3vw,44px);color:#9aa8c3;animation:viewIn .7s var(--ease) both}

/* learner */
.lhd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.lcust{display:flex;gap:12px;align-items:flex-start;margin-bottom:6px}
.lcust .avatar{width:54px;height:54px}
.lcust .bubble{font-size:15px;margin-bottom:10px;padding:14px 16px}
.lcust .bubble::after{display:none}
.lcust .reply{font-size:14px;margin:6px 0 10px}
.lcard .ask .avatar{width:46px;height:46px}
.lcard .askbubble{font-size:15px}
.lcard .rcards{grid-template-columns:1fr 1fr;gap:10px}
.lcard .rcard{padding:12px;gap:8px}
.lcard .rcard .quote{font-size:13px;min-height:0}
.lcard .rcard img{max-width:120px}

function netState(bad) { $('#net').classList.toggle('on', !!bad); }

class ApiError extends Error {}
async function api(action, data = {}, post = false, tries = 3) {
  for (let i = 0; i < tries; i++) {
    const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 20000);
    try {
      let res;
      if (post) res = await fetch(CONFIG.API_URL, { method: 'POST', body: JSON.stringify(Object.assign({ action }, data)), signal: ctl.signal });
      else res = await fetch(CONFIG.API_URL + '?' + new URLSearchParams(Object.assign({ action }, data, { _: Date.now() })), { signal: ctl.signal });
      const j = await res.json();
      netState(false);
      if (!j.ok) {
        if (j.error === 'BUSY' && i < tries - 1) { await sleep(600 + Math.random() * 1400); continue; }
        throw new ApiError(j.error);
      }
      return j;
    } catch (e) {
      if (e instanceof ApiError) throw e;
      netState(true);
      if (i === tries - 1) throw e;
      await sleep(800 * (i + 1) + Math.random() * 600);
    } finally { clearTimeout(to); }
  }
}

/* adaptive poller: jitter + backoff + slows down in background tabs */
const Poller = {
  t: null, fn: null, int: null, fails: 0, id: 0,
  start(fn, interval) { this.stop(); this.fn = fn; this.int = interval; this.fails = 0; const id = ++this.id; this._loop(id); },
  async _loop(id) {
    if (id !== this.id) return;
    try { await this.fn(); this.fails = 0; } catch (e) { this.fails++; handleErr(e, true); }
    if (id !== this.id) return;
    let ms = document.hidden ? CONFIG.POLL.hidden : this.int();
    ms = Math.min(30000, ms * Math.pow(1.6, this.fails)) * (0.85 + Math.random() * 0.3);
    this.t = setTimeout(() => this._loop(id), ms);
  },
  now() { if (this.fn) { clearTimeout(this.t); const id = ++this.id; this._loop(id); } },
  stop() { clearTimeout(this.t); this.id++; }
};
document.addEventListener('visibilitychange', () => { if (!document.hidden) Poller.now(); });

function handleErr(e, quiet) {
  const m = (e && e.message) || String(e);
  if (m === 'AUTH') { store.del(SK.trainer); toast('Session expired — please log in again'); return goLanding('trainer'); }
  if (!quiet) toast(m === 'BUSY' ? 'Server is busy, please try again' : (/abort|fetch|network/i.test(m) ? 'Connection problem — retrying' : m));
}

function setTop(html) { $('#topRight').innerHTML = html || ''; }
function setApp(html, keepScroll) { $('#app').innerHTML = '<div class="view">' + html + '</div>'; if (!keepScroll) window.scrollTo({ top: 0, behavior: 'smooth' }); }
function setAccent(c) { document.documentElement.style.setProperty('--acc', c || '#188CCD'); }

function countUp(el, to, ms = 900) {
  const from = Number(el.dataset.v || 0); el.dataset.v = to;
  if (from === to) { el.textContent = to; return; }
  const t0 = performance.now();
  const step = t => { const k = Math.min(1, (t - t0) / ms); el.textContent = Math.round(from + (to - from) * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function sparkle(x, y, n = 26) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cols = ['#F8991D', '#188CCD', '#00A99B', '#223974'];
  for (let i = 0; i < n; i++) {
    const s = document.createElement('i'); s.className = 'spark';
    const a = Math.random() * Math.PI * 2, d = 60 + Math.random() * 120;
    s.style.cssText = `left:${x}px;top:${y}px;background:${cols[i % 4]};--x:${Math.cos(a) * d}px;--y:${Math.sin(a) * d + 40}px;--r:${Math.random() * 540}deg`;
    document.body.appendChild(s); setTimeout(() => s.remove(), 1500);
  }
}
function qrImg(text) {
  try { if (!window.qrcode) return ''; const q = qrcode(0, 'M'); q.addData(text); q.make(); return '<img alt="QR code" src="' + q.createDataURL(8, 0) + '">'; }
  catch (e) { return ''; }
}

function modal(html) {

  trainerTop(`<span class="chip"><span class="dot"></span>${esc(runId)}</span>`);
  setApp('<div class="center"><span class="spinner"></span></div>');
  Poller.start(trainerTick, () => (T.data && T.data.state.phase === 'open') ? CONFIG.POLL.trainerLive : CONFIG.POLL.trainerIdle);
}

async function trainerTick() {
  const d = await api('tstate', { token: T.auth.token, runId: T.runId });
  T.data = d;
  const s = d.state;
  const key = s.v + '|' + s.phase + '|' + s.idx;
  if (key !== T.key) { T.key = key; renderTrainer(); } else patchTrainer();
  if (s.lbv !== LB.lbv) loadLB().catch(() => {});
}

function navHTML(d) {
  const s = d.state;
  let lastRound = null;
  const dots = d.outline.map((o, i) => {
    const sep = lastRound !== null && lastRound !== o.round ? '<span class="step sep"></span>' : ''; lastRound = o.round;
    const cls = [o.scored ? '' : 'd', (o.done || (!o.scored && i < s.idx)) ? 'done' : '', i === s.idx ? 'now' : ''].join(' ');
    return `${sep}<button class="step ${cls}" style="--c:${esc(o.accent)}" data-go="${i}" title="${esc(o.label)}"></button>`;
  }).join('');
  const opts = d.outline.map((o, i) => `<option value="${i}" ${i === s.idx ? 'selected' : ''}>${i + 1}. ${esc(o.label)}${o.scored && o.done ? ' ✓' : ''}</option>`).join('');
  const atStart = s.idx <= 0, atEnd = s.idx >= d.outline.length;
  let main;
  if (s.phase === 'lobby') main = `<button class="btn orange" id="mainBtn" data-op="next">${esc(ACT.startLabel)}</button>`;
  else if (s.phase === 'open') main = `<button class="btn orange" id="mainBtn" data-op="reveal">Reveal answer</button>`;
  else if (s.phase === 'ended') main = '';
  else main = `<button class="btn acc" id="mainBtn" data-op="next">${s.idx + 1 >= d.outline.length ? 'Finish →' : 'Next →'}</button>`;
  return `<div class="glass navbar"><button class="btn ghost sm" id="prevBtn" ${atStart || s.phase === 'lobby' ? 'disabled' : ''}>← Prev</button>
    <div class="stepper">${dots}</div>
    <select class="jump" id="jump"><option value="" disabled ${s.idx < 0 || atEnd ? 'selected' : ''}>Go to…</option>${opts}</select>
    ${main}${s.phase === 'open' ? `<button class="btn ghost sm" id="nextBtn" ${atEnd ? 'disabled' : ''}>Skip →</button>` : ''}
    <span class="kbd"><b>←</b> <b>→</b></span></div>`;
}
function ctrlBar(d, extra) {
  return `<div class="ctrlbar"><span class="chip">👥 <span id="pc">${d.participants.length}</span></span>
    <button class="btn ghost sm" id="share">Share</button>
    <a class="btn ghost sm" href="${esc(boardUrl(T.runId))}" target="_blank" rel="noopener">Projector board</a>
    <button class="btn ghost sm" id="home">All runs</button>
    ${d.state.phase !== 'ended' ? '<button class="btn ghost sm" id="end">End session</button>' : ''}${extra || ''}</div>${navHTML(d)}`;
}
function bindCtrl() {
  const s = $('#share'); if (s) s.onclick = shareModal;
  const h = $('#home'); if (h) h.onclick = goTrainerHome;
  const e = $('#end'); if (e) e.onclick = async () => { if (await confirmBox('End this session?', 'Participants will see the final leaderboard. You can reopen it later from your runs.', 'End session')) advance('end'); };
  const n = $('#mainBtn'); if (n) n.onclick = () => n.dataset.op === 'reveal' ? advance('reveal') : navigate(T.data.state.idx + 1);
  const p = $('#prevBtn'); if (p) p.onclick = () => navigate(T.data.state.idx - 1);
  const x = $('#nextBtn'); if (x) x.onclick = () => navigate(T.data.state.idx + 1);
  const j = $('#jump'); if (j) j.onchange = () => navigate(Number(j.value));
  $$('[data-go]').forEach(b => b.onclick = () => navigate(Number(b.dataset.go)));
}
function shareModal() {
  const url = joinUrl(T.runId);
  const m = modal(`<div class="eyebrow">Invite participants</div><div class="h2" style="margin:4px 0 6px">Scan or open the link</div>
    <div class="qr">${qrImg(url)}</div><div class="joincode" style="text-align:center;font-size:34px">${esc(T.runId)}</div>
    <div class="link">${esc(url)}</div><div class="row" style="justify-content:flex-end"><button class="btn ghost" data-close>Close</button><button class="btn" id="cp">Copy link</button></div>`);
  $('#cp', m).onclick = () => copy(url);
}
async function navigate(to) {
  const d = T.data; if (!d || T.busy) return;
  const n = d.outline.length;
  to = Math.max(0, Math.min(n, to));
  if (to === d.state.idx && d.state.phase !== 'lobby') return;
  if (d.state.phase === 'open') {
    const ok = await confirmBox('Voting is still open', `Close voting for this question and score the answers received so far before moving?`, 'Close & move', 'Stay here');
    if (!ok) { const j = $('#jump'); if (j) j.value = d.state.idx; return; }
  }
  advance('goto', to);
}
async function advance(op, to) {
  if (T.busy) return; T.busy = true;
  const b = $('#mainBtn'); if (b && op !== 'card') { b.disabled = true; b.dataset.label = b.innerHTML; b.innerHTML = '<span class="spinner" style="border-top-color:#fff"></span>'; }
  try { await api('advance', { token: T.auth.token, runId: T.runId, op, to: to == null ? '' : to, v: T.data ? T.data.state.v : '' }, true); T.key = ''; await trainerTick(); }
  catch (e) { handleErr(e); if (b && op !== 'card') { b.disabled = false; b.innerHTML = b.dataset.label; } }
  finally { T.busy = false; }
}
document.addEventListener('keydown', e => {
  if (!T.runId || !T.data || document.querySelector('.modal-bg')) return;
  if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) return;
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter') { const b = $('#mainBtn'); if (b && !b.disabled) { e.preventDefault(); b.click(); } }
  if (e.key === 'ArrowLeft') { const p = $('#prevBtn'); if (p && !p.disabled) { e.preventDefault(); p.click(); } }
});

function renderTrainer() {
  const d = T.data, s = d.state, it = d.item;
  setAccent(it ? it.accent : '#188CCD');
  if (s.phase === 'lobby') {
    const url = joinUrl(T.runId);
    setApp(ctrlBar(d) + `<div class="lobbystage stagger"><div class="glass strong qrbox"><div class="eyebrow">Join the session</div><div class="qr">${qrImg(url) || '<div class="empty">QR unavailable — share the link</div>'}</div>
        <div class="muted" style="font-size:12px;font-weight:700;letter-spacing:.1em">SESSION CODE</div><div class="joincode">${esc(T.runId)}</div>
        <div class="link">${esc(url)}</div><button class="btn block" id="cpl">Copy link</button></div>
      <div class="glass strong people"><div class="row" style="justify-content:space-between;align-items:flex-end"><div><div class="eyebrow">Waiting room</div><div class="h2">Participants ready</div></div>
        <div class="bigcount" id="bc">0</div></div><div class="cloud" id="cloud"></div>
        <p class="muted" style="font-size:13px;margin-top:12px">Names appear as people join. Late joiners can still come in after you start.</p></div></div>`);
    $('#cpl').onclick = () => copy(url);
    T.shown = {}; patchTrainer();
  } else if (s.phase === 'open' || s.phase === 'revealed') {
    setApp(ctrlBar(d) + `<div class="glass strong tstage">${ACT.trainerQuestion(it, s)}
      ${s.phase === 'revealed' ? speedWall(s.reveal) : ''}
      <div class="glass counter"><div class="ring" id="ring"><b id="ringT">0%</b></div><div><div class="big"><span id="ans">0</span> <span class="muted" style="font-size:18px">/ <span id="tot">0</span></span></div>
      <div class="lbl">${s.phase === 'open' ? 'participants answered · voting is open' : 'answered · results revealed'}</div></div></div></div>`, true);
    patchTrainer();
  } else if (s.phase === 'reflection') {
    setApp(ctrlBar(d) + `<div class="glass strong tstage">${ACT.trainerDiscussion(it, s)}</div>`, true);
    if (ACT.bindTrainerDiscussion) ACT.bindTrainerDiscussion(it, s);
  } else if (s.phase === 'ended') {
    setApp(ctrlBar(d, '<button class="btn" id="resBtn">Full results</button>') + `<div class="glass strong" style="padding:26px"><div class="eyebrow" style="color:var(--orange)">Activity complete</div>
      <div class="h1">Final leaderboard</div><div id="finalLb"><div class="empty"><span class="spinner" style="margin:auto"></span></div></div>
      <p class="muted" style="font-size:12px;margin-top:12px">Click any step above to revisit it.</p></div>`, true);
    $('#resBtn').onclick = () => showResults(T.runId);
    loadLB(true).then(() => { const f = $('#finalLb'); if (f) f.innerHTML = LB.rows.length ? podiumHTML(LB.rows) + '<div class="cols2" style="margin-top:16px">' + rowsHTML(LB.rows) + '</div>' : '<div class="empty">No answers recorded.</div>'; }).catch(handleErr);
  }
  bindCtrl();
}

function patchTrainer() {
  const d = T.data, s = d.state;
  const pc = $('#pc'); if (pc) pc.textContent = d.participants.length;
  if (s.phase === 'lobby') {
    const cloud = $('#cloud'); if (!cloud) return;
    T.shown = T.shown || {};
    d.participants.forEach(p => { if (!T.shown[p.k]) { T.shown[p.k] = 1; cloud.insertAdjacentHTML('beforeend', `<span class="pname" dir="auto">${esc(p.n)}</span>`); } });
    countUp($('#bc'), d.participants.length, 500);
  } else if (s.phase === 'open' || s.phase === 'revealed') {
    const arena = $('#arena'); if (!arena) return;
    const counts = s.phase === 'open' ? d.live : (s.reveal && s.reveal.counts);
    const total = paintBars(arena, counts || {}, s.phase === 'revealed' && s.reveal ? s.reveal.correct : '', true);
    const tot = d.participants.length;
    countUp($('#ans'), total, 500); $('#tot').textContent = tot;
    const p = tot ? Math.round(total * 100 / tot) : 0;
    $('#ring').style.background = `conic-gradient(var(--acc) ${p}%, rgba(34,57,116,.08) 0)`; $('#ringT').textContent = p + '%';
  }
}

async function showResults(runId) {
  Poller.stop(); unmountFab(); setAccent('#188CCD');
  T.auth = T.auth || store.get(SK.trainer);
  trainerTop(`<span class="chip">${esc(runId)}</span>`);
  setApp('<div class="center"><span class="spinner"></span></div>');
  try {
    const r = await api('results', { token: T.auth.token, runId });
    LB.me = null;
    setApp(`<div class="row" style="justify-content:space-between;margin-bottom:18px"><div><div class="eyebrow">Results</div><div class="h1">${esc(runId)}</div></div>
      <div class="row"><a class="btn ghost" href="${esc(boardUrl(runId))}" target="_blank" rel="noopener">Projector board</a><button class="btn" id="back">← All runs</button></div></div>
      <div class="board"><div class="glass strong" style="padding:22px"><div class="h2">Leaderboard</div>${r.leaderboard.length ? podiumHTML(r.leaderboard) + rowsHTML(r.leaderboard) : '<div class="empty">No participants yet.</div>'}</div>
      <div>${r.items.map(q => {
        const acc = q.answered ? Math.round(q.correct * 100 / q.answered) : 0;
        return `<div class="glass qstat"><div class="row" style="justify-content:space-between"><b>${esc(q.label)}</b><span class="muted" style="font-size:13px">${q.answered} answered</span></div>
          <div class="accbar"><i style="width:${acc}%"></i></div>
          <div class="row" style="justify-content:space-between"><div class="dist">${Object.keys(q.counts).map(k => `<span class="${k === q.correctLetter ? 'c' : ''}">${k}: ${q.counts[k]}</span>`).join('')}</div><b>${q.answered ? acc + '% correct' : 'Not played'}</b></div></div>`;
      }).join('')}</div></div>`);

/* ============================ learner ============================ */
const L = { runId: null, me: null, v: '', state: null, item: null, total: 0, questions: 0, key: '', sending: false, pick: null };

function learnerStart(runId) {
  L.runId = runId.toUpperCase();
  L.me = store.get(SK.me(L.runId));
  setTop(`<span class="chip"><span class="dot"></span>${esc(L.runId)}</span>`);
  if (L.me && L.me.pid) return rejoinAndGo();
  showJoin();
}
function showJoin(err) {
  Poller.stop(); unmountFab();
  setApp(`<div class="center"><div class="hero glass strong stagger"><img class="logo" src="${img('logo.webp')}" alt="United Pharmacy">${ACT.heroArt || ''}
    <div class="h1 title">${esc(ACT.title)}</div><div class="sub">Session <b>${esc(L.runId)}</b> · enter your name to join</div>
    <form id="jf"><div class="field"><label>Full name</label><input id="nm" maxlength="40" autocomplete="name" required dir="auto"></div>
    <div class="field"><label>Employee ID <span style="text-transform:none;font-weight:600">(optional)</span></label><input id="em" maxlength="20" inputmode="numeric"></div>
    <button class="btn block lg" id="jb">Join session</button></form>${err ? `<p style="color:#b4560b;margin-top:12px;font-weight:600">${esc(err)}</p>` : ''}</div></div>`);
  $('#jf').onsubmit = async e => {
    e.preventDefault(); const b = $('#jb'); b.disabled = true; b.innerHTML = '<span class="spinner" style="border-top-color:#fff"></span>';
    try {
      const r = await api('join', { runId: L.runId, name: $('#nm').value, emp: $('#em').value }, true, 5);
      L.me = { pid: r.pid, k: r.k, name: r.name, emp: $('#em').value, answers: {} };
      store.set(SK.me(L.runId), L.me);
      goLearnerLoop();
    } catch (err2) { const m = err2.message || ''; showJoin(/not found/i.test(m) ? 'Session code not found. Check the link with your trainer.' : m); }
  };
}
async function rejoinAndGo() {
  try { await api('join', { runId: L.runId, name: L.me.name, emp: L.me.emp || '', pid: L.me.pid }, true, 5); goLearnerLoop(); }
  catch (e) {
    const m = e.message || '';
    if (/ended/i.test(m)) { goLearnerLoop(); return; }
    if (/not found/i.test(m)) { store.del(SK.me(L.runId)); return showJoin('Session code not found.'); }
    handleErr(e); setTimeout(rejoinAndGo, 3000);
  }
}
function goLearnerLoop() {
  mountFab(L.runId, L.me.k);
  L.key = ''; L.v = '';
  setApp('<div class="center"><span class="spinner"></span></div>');
  Poller.start(learnerTick, () => CONFIG.POLL.learner);
}
async function learnerTick() {
  const r = await api('state', { runId: L.runId, v: L.v, pid: L.me.pid });
  const lbv = r.same ? r.lbv : r.state.lbv;
  if (lbv !== L.lbvSeen) { L.lbvSeen = lbv; setTimeout(() => loadLB().then(() => paintScore()).catch(() => {}), Math.random() * CONFIG.POLL.lbSpread); }
  if (r.same) return;
  L.v = r.state.v; L.state = r.state; L.item = r.item; L.total = r.total; L.questions = r.questions || L.questions;
  const key = r.state.v + '|' + r.state.phase + '|' + r.state.idx;
  if (key !== L.key) { L.key = key; renderLearner(); }
}
function myRow() { return LB.rows.find(x => x.k === L.me.k); }
function scoreBarHTML(bonus) {
  const r = myRow(); const pts = (r ? r.p : 0) + (bonus || 0);
  const q = L.item ? Number(L.item.qn) || 0 : 0;
  return `<div class="scorebar"><div class="glass"><b id="myPts" data-v="${pts}">${pts}</b><span>Points</span></div><div class="glass"><b id="myRank">${r ? '#' + r.r : '–'}</b><span>Rank</span></div>
    <div class="glass"><b>${q}<span style="font-size:14px;color:var(--muted)">/${L.questions}</span></b><span>${esc(ACT.unit)}</span></div></div>`;
}
function paintScore() {
  const r = myRow(); if (!r) return;
  const p = $('#myPts'); if (p) countUp(p, r.p, 700);
  const k = $('#myRank'); if (k) k.textContent = '#' + r.r;
}
function setSubmitMode(on) { document.body.classList.toggle('has-submit', !!on); }

function renderLearner() {
  const s = L.state, it = L.item;
  setAccent(it ? it.accent : '#188CCD');
  setSubmitMode(false);
  if (s.phase === 'lobby') {
    setApp(`<div class="lwrap"><div class="glass strong ready"><div class="check">${ICON.check}</div>
      <div class="h1" dir="auto">You're in, ${esc(L.me.name.split(' ')[0])}!</div>
      <p class="muted" style="margin:10px 0 20px">Waiting for the trainer to start <span class="dots"><i></i><i></i><i></i></span></p>
      <span class="chip">Session ${esc(L.runId)}</span></div></div>`);
  } else if (s.phase === 'open') {
    const mine = (L.me.answers || {})[it.id];
    L.pick = mine || null;
    setApp(`<div class="lwrap">${scoreBarHTML()}<div class="glass strong lcard">${ACT.learnerQuestion(it)}${bonusLine()}
      <div id="arena" class="${ACT.learnerArenaClass} ${mine ? 'locked' : ''}">${ACT.optionsHTML(it, false)}</div>
      <div id="lstat"></div>
      ${mine ? '' : `<div class="submitbar" id="sbar"><div class="hint" id="hint">Tap an option to choose it</div><button class="btn orange" id="submitBtn" disabled>Submit</button></div>`}</div></div>`);
    if (mine) markPick(mine, true);
    else {
      setSubmitMode(true);
      $$('#arena .pcard').forEach(c => c.onclick = () => { if (L.sending) return; L.pick = c.dataset.k; markPick(L.pick, false); });
      $('#submitBtn').onclick = () => submitAnswer(it.id);
    }
  } else if (s.phase === 'revealed') {
    const mine = (L.me.answers || {})[it.id];
    const counted = !!(s.reveal && (s.reveal.ks || []).includes(L.me.k));
    const my = (s.reveal && s.reveal.pts && s.reveal.pts[L.me.k]) || null; // [base, speed, streakBonus, streak]
    const ok = !!(mine && counted && mine === it.correct);
    const gained = my ? my[0] + my[1] + my[2] : 0;
    const pending = gained && LB.lbv !== s.lbv ? gained : 0;
    const W = ACT.words;
    const msg = ok ? (my && my[1] === 3 ? W.fast : W.ok) : (mine && !counted) ? 'Your answer arrived after voting closed.' : mine ? W.no : 'You didn\'t answer this one.';
    const parts = my && ok ? [`<span>+${my[0]} ${W.base}</span>`, my[1] ? `<span class="hot">⚡ +${my[1]} speed</span>` : '', my[2] ? `<span class="hot">🔥 +${my[2]} streak ×${my[3]}</span>` : ''].join('') : '';
    setApp(`<div class="lwrap">${scoreBarHTML(pending)}
      <div class="verdict ${ok ? 'ok' : 'no'}"><span class="em">${ok ? '🏆' : mine ? '💡' : '⏱️'}</span><div>${msg}${parts ? `<div class="breakdown">${parts}</div>` : ''}${!ok && mine && counted ? '<div class="breakdown"><span>Streak reset</span></div>' : ''}</div><span class="pts">+${gained}</span></div>
      <div class="glass strong lcard">${ACT.learnerRevealHead(it)}<div id="arena" class="${ACT.learnerArenaClass} locked">${ACT.optionsHTML(it, false)}</div>
      ${it.explanation ? `<div class="wait" dir="auto">${esc(it.explanation)}</div>` : ''}${speedWall(s.reveal)}</div></div>`);
    paintBars($('#arena'), (s.reveal && s.reveal.counts) || {}, it.correct, true);
    if (mine) markPick(mine, false);
    if (ok) { const v = $('.verdict'); const b = v.getBoundingClientRect(); setTimeout(() => sparkle(b.right - 40, b.top + b.height / 2), 250); }
  } else if (s.phase === 'reflection') {
    setApp(`<div class="lwrap">${scoreBarHTML()}<div class="glass strong lcard">${ACT.learnerDiscussion(it, s, L.me.answers || {})}
      <div class="wait" style="margin-top:16px"><span class="dots"><i></i><i></i><i></i></span> Discussion time — follow your trainer</div></div></div>`);
  } else if (s.phase === 'ended') {
    setApp(`<div class="lwrap"><div class="glass strong lcard"><div class="eyebrow" style="color:var(--orange)">Activity complete</div><div class="h1">Final leaderboard</div>
      <div id="finalLb"><div class="empty"><span class="spinner" style="margin:auto"></span></div></div></div></div>`);
    loadLB(true).then(() => {
      const f = $('#finalLb'); if (!f) return;
      const me = myRow();
      f.innerHTML = (me ? `<div class="verdict ok" style="margin-top:14px"><span class="em">🏅</span><div>You finished <b>#${me.r}</b> with <b>${me.p}</b> point${me.p === 1 ? '' : 's'}.</div></div>` : '') + podiumHTML(LB.rows) + rowsHTML(LB.rows);
      if (me && me.r <= 3) sparkle(innerWidth / 2, innerHeight / 3, 40);
    }).catch(() => {});
  }
}
function markPick(k, locked) {
  $$('#arena .pcard').forEach(c => { c.classList.toggle('sel', c.dataset.k === k); c.classList.toggle('dim', locked && c.dataset.k !== k); });
  if (locked) {
    $('#arena').classList.add('locked');
    const st = $('#lstat'); if (st) st.innerHTML = `<div class="wait"><span class="dots"><i></i><i></i><i></i></span> Answer submitted: <b>${esc(k)}</b>. Waiting for the reveal…</div>`;
  } else {
    const o = L.item.options[k];
    const h = $('#hint'); if (h) h.innerHTML = `Selected <b>${esc(k)}</b> · <span dir="auto">${esc(o ? o.t : '')}</span>`;
    const b = $('#submitBtn'); if (b) { b.disabled = false; b.textContent = 'Submit ' + k; }
  }
}
async function submitAnswer(itemId) {
  const k = L.pick;
  if (!k || L.sending || (L.me.answers || {})[itemId]) return;
  L.sending = true;
  const b = $('#submitBtn'); b.disabled = true; b.innerHTML = '<span class="spinner" style="border-top-color:#fff"></span>';
  const send = () => api('answer', { runId: L.runId, pid: L.me.pid, itemId, choice: k }, true, 4);
  try {
    let r;
    try { r = await send(); }
    catch (e) {
      if (e.message !== 'NOJOIN') throw e;
      await api('join', { runId: L.runId, name: L.me.name, emp: L.me.emp || '', pid: L.me.pid }, true, 5);
      r = await send();
    }
    L.me.answers = L.me.answers || {}; L.me.answers[itemId] = r.choice; store.set(SK.me(L.runId), L.me);
    const bar = $('#sbar'); if (bar) bar.remove(); setSubmitMode(false);
    markPick(r.choice, true);
  } catch (e) {
    handleErr(e);
    if (/closed/i.test(e.message || '')) Poller.now();
    else if (b) { b.disabled = false; b.textContent = 'Submit ' + k; }
  } finally { L.sending = false; }
}

/* ============================ projector board ============================ */
function boardStart(runId) {
  runId = runId.toUpperCase(); LB.runId = runId; LB.me = null;
  setTop(`<span class="chip"><span class="dot"></span>${esc(runId)}</span>`);
  setApp(`<div class="board"><div class="glass strong" style="padding:28px"><div class="eyebrow" style="color:var(--orange)">Live leaderboard</div><div class="h1">Session ${esc(runId)}</div>
    <div id="pod"></div></div><div class="glass strong" style="padding:22px"><div class="row" style="justify-content:space-between;margin-bottom:12px"><div class="h2">Rankings</div><span class="chip" id="cnt">0 players</span></div>
    <div id="list" class="cols2"></div><div class="row" style="margin-top:18px;gap:16px"><div class="qr" style="width:120px;margin:0;padding:8px">${qrImg(joinUrl(runId))}</div>
    <div class="muted" style="font-size:13px">Late? Scan to join<br><b style="font-size:20px;color:var(--navy)">${esc(runId)}</b></div></div></div></div>`);
  let last = '';
  Poller.start(async () => {
    const r = await api('board', { runId, lbv: LB.lbv });
    if (r.same) return;
    LB.rows = r.rows; LB.lbv = r.lbv;
    const sig = JSON.stringify(r.rows.map(x => [x.k, x.p, x.s]));
    if (sig === last) return; last = sig;
    $('#pod').innerHTML = r.rows.length ? podiumHTML(r.rows) : '<div class="empty">Scores appear after the first reveal.</div>';
    $('#list').innerHTML = rowsHTML(r.rows.slice(0, 40));
    $('#cnt').textContent = r.rows.length + ' players';
  }, () => CONFIG.POLL.board);
}

/* ============================ boot ============================ */
document.addEventListener('DOMContentLoaded', function boot() {
  if (/PASTE_YOUR/.test(CONFIG.API_URL)) {
    setApp('<div class="center"><div class="glass strong hero"><div class="h2">Setup needed</div><p class="muted" style="margin-top:8px">Paste your Apps Script Web App URL into <b>CONFIG.API_URL</b>.</p></div></div>');
    return;
  }
  const run = params.get('run'), view = params.get('view');
  if (run && view === 'board') return boardStart(run);
  if (run) return learnerStart(run);
  const t = store.get(SK.trainer);
  if (t && t.token && Date.now() - (t.at || 0) < 6 * 3600 * 1000) {
    T.auth = t; const r = store.get(SK.run);
    return r ? openRun(r) : goTrainerHome();
  }
  goLanding();
});
</script>
</body>
</html>
